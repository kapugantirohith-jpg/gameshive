<div class=\"flex items-center space-x-2 font-black text-lg mb-1\" id=\"feedbackHeader\">\n                        <i id=\"feedbackIcon\" class=\"fa-solid\"><\/i>\n                        <span id=\"feedbackTitle\">Title<\/span>\n                    <\/div>\n                    <div id=\"feedbackText\" class=\"font-bold text-base\">Explanation...<\/div>\n                <\/div>\n\n                <!-- Next Button -->\n                <div class=\"flex justify-end pt-2\">\n                    <button id=\"nextPuzzleBtn\" onclick=\"nextPuzzle()\" class=\"hidden px-7 py-3 rounded-xl bg-amber-900 hover:bg-amber-950 text-amber-100 font-extrabold text-sm shadow-xl transition flex items-center space-x-2\">\n                        <span>Next Puzzle<\/span>\n                        <i class=\"fa-solid fa-arrow-right\"><\/i>\n                    <\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <!-- Game Completed Screen -->\n        <div id=\"completedScreen\" class=\"hidden wood-panel p-8 sm:p-12 rounded-3xl text-center space-y-6\">\n            <div class=\"w-20 h-20 mx-auto rounded-full bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-amber-300 text-4xl float-anim\">\n                <i class=\"fa-solid fa-trophy\"><\/i>\n            <\/div>\n            \n            <h2 class=\"vintage-font text-3xl sm:text-5xl font-black text-amber-100\">PUZZLE MASTERS! \ud83c\udf89<\/h2>\n            <p id=\"completedSubText\" class=\"text-amber-200/90 text-base max-w-md mx-auto leading-relaxed\">\n                You and your family solved all the math equation riddles in this chest!\n            <\/p>\n\n            <!-- Score Summary -->\n            <div class=\"bg-warm-900/90 border border-amber-800 p-6 rounded-2xl max-w-xs mx-auto text-center space-y-1\">\n                <div class=\"text-xs text-amber-400 font-bold uppercase tracking-wider\">PUZZLES SOLVED<\/div>\n                <div id=\"finalScoreVal\" class=\"text-4xl font-black text-amber-200\">10 / 10<\/div>\n            <\/div>\n\n            <div class=\"flex flex-col sm:flex-row justify-center gap-4 pt-4\">\n                <button onclick=\"showHomeScreen()\" class=\"px-6 py-3.5 bg-amber-700 hover:bg-amber-600 text-amber-950 font-black rounded-xl text-sm transition\">\n                    Back to Attic Chests\n                <\/button>\n            <\/div>\n        <\/div>\n\n    <\/main>\n\n    <!-- App Sound Synth & Puzzle Logic -->\n    <script>\n        // Math Picture Equation Puzzles Database\n        const PUZZLES_DB = [\n            {\n                id: 1,\n                category: \"fruit\",\n                categoryName: \"Fruit & Food Equations\",\n                equations: [\n                    \"\ud83c\udf4e + \ud83c\udf4e = 20\",\n                    \"\ud83c\udf4c + \ud83c\udf4c + \ud83c\udf4c = 27\",\n                    \"\ud83c\udf4e + \ud83c\udf4c = ?\"\n                ],\n                question: \"If 2 apples equal 20, and 3 bunches of bananas equal 27, what does 1 apple + 1 banana equal?\",\n                answer: 19,\n                options: [\"19\", \"15\", \"22\", \"17\"],\n                hint: \"Find the value of 1 apple first (20 \u00f7 2), then 1 banana (27 \u00f7 3), and add them!\",\n                explanation: \"1 apple = 10. 1 banana bunch = 9. So 10 + 9 = 19.\"\n            },\n            {\n                id: 2,\n                category: \"fruit\",\n                categoryName: \"Fruit & Food Equations\",\n                equations: [\n                    \"\ud83c\udf49 + \ud83c\udf49 = 16\",\n                    \"\ud83c\udf53 + \ud83c\udf53 + \ud83c\udf49 = 18\",\n                    \"\ud83c\udf49 + \ud83c\udf53 = ?\"\n                ],\n                question: \"If two watermelons equal 16, and two strawberries plus one watermelon equal 18, what is watermelon + strawberry?\",\n                answer: 13,\n                options: [\"9\", \"13\", \"8\", \"12\"],\n                hint: \"Watermelon is 16 \u00f7 2. Plug that into the second equation to find strawberry!\",\n                explanation: \"Watermelon = 8. Strawberry = (18 - 8) \u00f7 2 = 5. So watermelon (8) + strawberry (5) = 13.\"\n            },\n            {\n                id: 3,\n                category: \"animals\",\n                categoryName: \"Animal Kingdom Math\",\n                equations: [\n                    \"\ud83d\udc31 + \ud83d\udc31 + \ud83d\udc31 = 15\",\n                    \"\ud83d\udc36 + \ud83d\udc36 + \ud83d\udc31 = 17\",\n                    \"\ud83d\udc31 + \ud83d\udc36 = ?\"\n                ],\n                question: \"If 3 cats equal 15, and 2 dogs plus 1 cat equal 17, what is 1 cat + 1 dog?\",\n                answer: 11,\n                options: [\"9\", \"11\", \"8\", \"10\"],\n                hint: \"Each cat is 15 \u00f7 3. Use that in the second row to find the dog!\",\n                explanation: \"Cat = 5. 2 dogs + 5 = 17 -> 2 dogs = 12 -> Dog = 6. Cat (5) + Dog (6) = 11.\"\n            },\n            {\n                id: 4,\n                category: \"animals\",\n                categoryName: \"Animal Kingdom Math\",\n                equations: [\n                    \"\ud83e\udd89 + \ud83e\udd89 = 12\",\n                    \"\ud83d\udc30 + \ud83d\udc30 + \ud83e\udd89 = 20\",\n                    \"\ud83d\udc30 + \ud83e\udd89 = ?\"\n                ],\n                question: \"If 2 owls equal 12, and 2 rabbits plus 1 owl equal 20, what is 1 rabbit + 1 owl?\",\n                answer: 13,\n                options: [\"10\", \"13\", \"8\", \"14\"],\n                hint: \"Owl = 12 \u00f7 2. Rabbit = (20 - 6) \u00f7 2.\",\n                explanation: \"Owl = 6. 2 rabbits + 6 = 20 -> 2 rabbits = 14 -> Rabbit = 7. Rabbit (7) + Owl (6) = 13.\"\n            },\n            {\n                id: 5,\n                category: \"objects\",\n                categoryName: \"Treasure & Attic Objects\",\n                equations: [\n                    \"\ud83d\udddd\ufe0f + \ud83d\udddd\ufe0f + \ud83d\udddd\ufe0f = 30\",\n                    \"\ud83d\udce6 + \ud83d\udddd\ufe0f + \ud83d\udddd\ufe0f = 22\",\n                    \"\ud83d\udce6 + \ud83d\udddd\ufe0f = ?\"\n                ],\n                question: \"If 3 keys equal 30, and 1 treasure box plus 2 keys equal 22, what is 1 box + 1 key?\",\n                answer: 12,\n                options: [\"14\", \"12\", \"16\", \"18\"],\n                hint: \"Key = 30 \u00f7 3 = 10. Box + 20 = 22, so box = 2!\",\n                explanation: \"Key = 10. Box = 2. Box (2) + Key (10) = 12.\"\n            },\n            {\n                id: 6,\n                category: \"objects\",\n                categoryName: \"Treasure & Attic Objects\",\n                equations: [\n                    \"\u23f0 + \u23f0 = 18\",\n                    \"\ud83d\udd6f\ufe0f + \ud83d\udd6f\ufe0f + \u23f0 = 23\",\n                    \"\u23f0 + \ud83d\udd6f\ufe0f = ?\"\n                ],\n                question: \"If 2 clocks equal 18, and 2 candles plus 1 clock equal 23, what is 1 clock + 1 candle?\",\n                answer: 16,\n                options: [\"13\", \"16\", \"11\", \"15\"],\n                hint: \"Clock = 18 \u00f7 2. Candle = (23 - 9) \u00f7 2.\",\n                explanation: \"Clock = 9. 2 candles + 9 = 23 -> 2 candles = 14 -> Candle = 7. Clock (9) + Candle (7) = 16.\"\n            },\n            {\n                id: 7,\n                category: \"mixed\",\n                categoryName: \"Grandpa's Mixed Puzzle\",\n                equations: [\n                    \"\u2615 + \u2615 + \u2615 = 12\",\n                    \"\ud83c\udf69 + \ud83c\udf69 + \u2615 = 14\",\n                    \"\u2615 + \ud83c\udf69 = ?\"\n                ],\n                question: \"If 3 coffee mugs equal 12, and 2 donuts plus 1 mug equal 14, what is 1 mug + 1 donut?\",\n                answer: 9,\n                options: [\"9\", \"10\", \"8\", \"11\"],\n                hint: \"Mug = 12 \u00f7 3. Donut = (14 - 4) \u00f7 2.\",\n                explanation: \"Mug = 4. 2 donuts + 4 = 14 -> 2 donuts = 10 -> Donut = 5. Mug (4) + Donut (5) = 9.\"\n            },\n            {\n                id: 8,\n                category: \"mixed\",\n                categoryName: \"Grandpa's Mixed Puzzle\",\n                equations: [\n                    \"\u2b50 + \u2b50 + \u2b50 = 21\",\n                    \"\ud83c\udf19 + \u2b50 + \u2b50 = 17\",\n                    \"\u2b50 + \ud83c\udf19 = ?\"\n                ],\n                question: \"If 3 stars equal 21, and 1 moon plus 2 stars equal 17, what is 1 star + 1 moon?\",\n                answer: 10,\n                options: [\"10\", \"12\", \"9\", \"14\"],\n                hint: \"Star = 21 \u00f7 3. Moon = 17 - 14.\",\n                explanation: \"Star = 7. Moon + 14 = 17 -> Moon = 3. Star (7) + Moon (3) = 10.\"\n            }\n        ];\n\n        // Categories Configuration\n        const CATEGORIES = [\n            { id: \"all\", title: \"Full Puzzle Chest\", icon: \"fa-gem\", count: PUZZLES_DB.length, desc: \"Play all visual math riddles mixed together\" },\n            { id: \"fruit\", title: \"Fruit & Food\", icon: \"fa-apple-whole\", count: 2, desc: \"Apples, bananas, watermelons & strawberries\" },\n            { id: \"animals\", title: \"Animal Math\", icon: \"fa-cat\", count: 2, desc: \"Cats, dogs, owls & rabbits equation puzzles\" },\n            { id: \"objects\", title: \"Attic Objects\", icon: \"fa-key\", count: 2, desc: \"Keys, treasure boxes, clocks & candles\" },\n            { id: \"mixed\", title: \"Mixed Teasers\", icon: \"fa-mug-hot\", count: 2, desc: \"Coffee, donuts, stars & moons\" }\n        ];\n\n        let currentCategory = \"all\";\n        let activePuzzleSet = [];\n        let currentPuzzleIdx = 0;\n        let totalSolved = parseInt(localStorage.getItem('math_puzzles_solved') || '0');\n        let soundEnabled = true;\n\n        window.onload = function() {\n            renderCategoryCards();\n            updateSolvedHeader();\n        };\n\n        function updateSolvedHeader() {\n            document.getElementById('scoreText').innerText = totalSolved;\n            localStorage.setItem('math_puzzles_solved', totalSolved);\n        }\n\n        function renderCategoryCards() {\n            const container = document.getElementById('categoryGrid');\n            container.innerHTML = CATEGORIES.map(cat => `\n                <div onclick=\"startPuzzleGame('${cat.id}')\" class=\"wood-panel p-5 rounded-2xl cursor-pointer hover:border-amber-500 transition group flex flex-col justify-between space-y-3\">\n                    <div>\n                        <div class=\"w-10 h-10 rounded-xl bg-amber-900/80 border border-amber-600/50 flex items-center justify-center text-amber-300 text-lg mb-3 group-hover:scale-110 transition\">\n                            <i class=\"fa-solid ${cat.icon}\"><\/i>\n                        <\/div>\n                        <h4 class=\"vintage-font font-bold text-amber-100 text-base group-hover:text-amber-300 transition\">${cat.title}<\/h4>\n                        <p class=\"text-xs text-amber-300/70 mt-1 leading-normal\">${cat.desc}<\/p>\n                    <\/div>\n                    <div class=\"text-[10px] font-extrabold text-amber-400 bg-amber-950/80 border border-amber-800 px-2.5 py-1 rounded-lg w-max\">\n                        ${cat.count} PUZZLES\n                    <\/div>\n                <\/div>\n            `).join('');\n        }\n\n        function startPuzzleGame(catId) {\n            currentCategory = catId;\n            if (catId === 'all') {\n                activePuzzleSet = [...PUZZLES_DB];\n            } else {\n                activePuzzleSet = PUZZLES_DB.filter(p => p.category === catId);\n            }\n\n            currentPuzzleIdx = 0;\n            document.getElementById('homeScreen').classList.add('hidden');\n            document.getElementById('completedScreen').classList.add('hidden');\n            document.getElementById('gameScreen').classList.remove('hidden');\n\n            renderPuzzle();\n        }\n\n        function pickRandomPuzzle() {\n            const randomIdx = Math.floor(Math.random() * PUZZLES_DB.length);\n            activePuzzleSet = [PUZZLES_DB[randomIdx]];\n            currentPuzzleIdx = 0;\n\n            document.getElementById('homeScreen').classList.add('hidden');\n            document.getElementById('completedScreen').classList.add('hidden');\n            document.getElementById('gameScreen').classList.remove('hidden');\n\n            renderPuzzle();\n        }\n\n        function renderPuzzle() {\n            const p = activePuzzleSet[currentPuzzleIdx];\n\n            document.getElementById('currentCategoryBadge').innerText = p.categoryName;\n            document.getElementById('puzzleNum').innerText = currentPuzzleIdx + 1;\n            document.getElementById('totalPuzzles').innerText = activePuzzleSet.length;\n\n            const eqContainer = document.getElementById('puzzleEquations');\n            eqContainer.innerHTML = p.equations.map(eq => `<div>${eq}<\/div>`).join('');\n\n            document.getElementById('puzzleQuestion').innerText = p.question;\n            document.getElementById('userAnswerInput').value = '';\n            document.getElementById('userAnswerInput').disabled = false;\n\n            document.getElementById('hintBox').classList.add('hidden');\n            document.getElementById('multipleChoiceGrid').classList.add('hidden');\n            document.getElementById('feedbackBox').classList.add('hidden');\n            document.getElementById('nextPuzzleBtn').classList.add('hidden');\n\n            // Render Options\n            const mcContainer = document.getElementById('multipleChoiceGrid');\n            mcContainer.innerHTML = p.options.map(opt => `\n                <button type=\"button\" onclick=\"submitMultipleChoice('${opt}')\" class=\"w-full text-left p-3.5 rounded-xl bg-amber-100/90 hover:bg-amber-200 border-2 border-amber-800/40 text-amber-950 font-bold text-sm transition flex items-center justify-between\">\n                    <span>${opt}<\/span>\n                    <i class=\"fa-regular fa-circle text-amber-800\"><\/i>\n                <\/button>\n            `).join('');\n\n            if (soundEnabled) {\n                readPuzzleAloud();\n            }\n        }\n\n        function handleAnswerSubmit(e) {\n            e.preventDefault();\n            const inputVal = parseFloat(document.getElementById('userAnswerInput').value);\n            const p = activePuzzleSet[currentPuzzleIdx];\n\n            const isCorrect = Math.abs(inputVal - p.answer) < 0.001;\n            processResult(isCorrect);\n        }\n\n        function submitMultipleChoice(selectedOpt) {\n            const p = activePuzzleSet[currentPuzzleIdx];\n            const isCorrect = Math.abs(parseFloat(selectedOpt) - p.answer) < 0.001;\n            processResult(isCorrect);\n        }\n\n        function processResult(isCorrect) {\n            const p = activePuzzleSet[currentPuzzleIdx];\n            document.getElementById('userAnswerInput').disabled = true;\n\n            const fbBox = document.getElementById('feedbackBox');\n            const fbIcon = document.getElementById('feedbackIcon');\n            const fbTitle = document.getElementById('feedbackTitle');\n            const fbText = document.getElementById('feedbackText');\n\n            fbBox.classList.remove('hidden', 'bg-emerald-200', 'border-emerald-700', 'text-emerald-950', 'bg-rose-200', 'border-rose-700', 'text-rose-950');\n\n            if (isCorrect) {\n                totalSolved++;\n                updateSolvedHeader();\n                triggerConfetti();\n\n                fbBox.classList.add('bg-emerald-200', 'border-emerald-700', 'text-emerald-950');\n                fbIcon.className = \"fa-solid fa-circle-check text-emerald-800\";\n                fbTitle.innerText = \"Fantastic! You Got It Right!\";\n                fbText.innerText = p.explanation;\n            } else {\n                fbBox.classList.add('bg-rose-200', 'border-rose-700', 'text-rose-950');\n                fbIcon.className = \"fa-solid fa-circle-xmark text-rose-800\";\n                fbTitle.innerText = \"Not Quite! The Correct Answer is: \" + p.answer;\n                fbText.innerText = p.explanation;\n            }\n\n            document.getElementById('nextPuzzleBtn').classList.remove('hidden');\n        }\n\n        function revealHint() {\n            const p = activePuzzleSet[currentPuzzleIdx];\n            document.getElementById('hintText').innerText = p.hint;\n            document.getElementById('hintBox').classList.remove('hidden');\n        }\n\n        function toggleMultipleChoice() {\n            const grid = document.getElementById('multipleChoiceGrid');\n            grid.classList.toggle('hidden');\n        }\n\n        function nextPuzzle() {\n            currentPuzzleIdx++;\n            if (currentPuzzleIdx < activePuzzleSet.length) {\n                renderPuzzle();\n            } else {\n                showCompletedScreen();\n            }\n        }\n\n        function showCompletedScreen() {\n            document.getElementById('gameScreen').classList.add('hidden');\n            document.getElementById('completedScreen').classList.remove('hidden');\n            document.getElementById('finalScoreVal').innerText = `${activePuzzleSet.length} / ${activePuzzleSet.length}`;\n            triggerConfetti();\n        }\n\n        function showHomeScreen() {\n            document.getElementById('gameScreen').classList.add('hidden');\n            document.getElementById('completedScreen').classList.add('hidden');\n            document.getElementById('homeScreen').classList.remove('hidden');\n            if (window.speechSynthesis) window.speechSynthesis.cancel();\n        }\n\n        function toggleSpeech() {\n            soundEnabled = !soundEnabled;\n            document.getElementById('speechIcon').className = soundEnabled ? \"fa-solid fa-volume-high text-amber-400\" : \"fa-solid fa-volume-xmark text-rose-500\";\n            if (!soundEnabled && window.speechSynthesis) {\n                window.speechSynthesis.cancel();\n            }\n        }\n\n        function readPuzzleAloud() {\n            if (!('speechSynthesis' in window)) return;\n            window.speechSynthesis.cancel();\n\n            const p = activePuzzleSet[currentPuzzleIdx];\n            const textToRead = p.equations.join(\". \") + \". \" + p.question;\n            const utterance = new SpeechSynthesisUtterance(textToRead);\n            utterance.rate = 0.9;\n            utterance.pitch = 0.9;\n            window.speechSynthesis.speak(utterance);\n        }\n\n        function triggerConfetti() {\n            if (typeof confetti === 'function') {\n                confetti({\n                    particleCount: 80,\n                    spread: 60,\n                    origin: { y: 0.6 }\n                });\n            }\n        }\n    <\/script>\n<\/body>\n<\/html>"}, {"id": "riddle", "t": "Grandpa's Riddle Attic", "cat": "Puzzle", "e": "\ud83e\uddd3", "g": "#a855f7,#4c1d95", "html": "<!DOCTYPE html>\n<html lang=\"en\" class=\"dark h-full bg-slate-950\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Grandpa's Riddle Attic \u2022 Classic Old Riddles to Play Together<\/title>\n    <!-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <script>\n        tailwind.config = {\n            darkMode: 'class',\n            theme: {\n                extend: {\n                    colors: {\n                        amber: {\n                            50: '#fffbeb',\n                            100: '#fef3c7',\n                            800: '#92400e',\n                            900: '#78350f',\n                            950: '#451a03',\n                        },\n                        warm: {\n                            900: '#1c1917',\n                            950: '#0c0a09'\n                        }\n                    }\n                }\n            }\n        }\n    <\/script>\n    <!-- Font Awesome Icons -->\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <!-- Google Fonts for Vintage Cozy Vibe -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&family=Special+Elite&display=swap\" rel=\"stylesheet\">\n    <!-- Canvas Confetti -->\n    <script src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\"><\/script>\n\n    <style>\n        body { font-family: 'Plus Jakarta Sans', sans-serif; }\n        .vintage-font { font-family: 'Cinzel', serif; }\n        .typewriter-font { font-family: 'Special Elite', monospace; }\n\n        .wood-panel {\n            background: linear-gradient(135deg, rgba(30, 20, 10, 0.95), rgba(15, 10, 5, 0.98)), url('https://images.unsplash.com/photo-1546484475-7f7bd55792da?auto=format&fit=crop&w=1200&q=80');\n            background-size: cover;\n            border: 2px solid #78350f;\n        }\n\n        .paper-card {\n            background: #fef3c7;\n            background-image: radial-gradient(#d97706 0.5px, transparent 0.5px);\n            background-size: 16px 16px;\n            color: #451a03;\n            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);\n        }\n\n        .gold-border {\n            border: 2px solid #d97706;\n        }\n        \n        @keyframes floatSlow {\n            0%, 100% { transform: translateY(0px); }\n            50% { transform: translateY(-8px); }\n        }\n        .float-anim {\n            animation: floatSlow 4s ease-in-out infinite;\n        }\n    <\/style>\n<\/head>\n<body class=\"bg-warm-950 text-amber-50 min-h-screen flex flex-col selection:bg-amber-600 selection:text-white\">\n\n    <!-- Header Navigation -->\n    <header class=\"border-b border-amber-900/50 bg-warm-900/90 backdrop-blur-md sticky top-0 z-40 px-4 lg:px-8 py-3 flex items-center justify-between\">\n        <div class=\"flex items-center space-x-3 cursor-pointer\" onclick=\"showHomeScreen()\">\n            <div class=\"w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-700 via-amber-800 to-yellow-600 flex items-center justify-center shadow-lg shadow-amber-900/40 gold-border\">\n                <i class=\"fa-solid fa-hourglass-half text-amber-100 text-xl float-anim\"><\/i>\n            <\/div>\n            <div>\n                <div class=\"flex items-center space-x-2\">\n                    <span class=\"vintage-font font-black text-lg sm:text-xl tracking-wide text-amber-200\">GRANDPA'S RIDDLE ATTIC<\/span>\n                    <span class=\"text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full\">OLD CLASSICS<\/span>\n                <\/div>\n                <p class=\"text-[11px] text-amber-400/80 hidden sm:block\">Traditional Wisdom Riddles for Kids & Grandparents<\/p>\n            <\/div>\n        <\/div>\n\n        <!-- Top Right Stats & Controls -->\n        <div class=\"flex items-center space-x-3 sm:space-x-4\">\n            <div class=\"flex items-center space-x-2 bg-amber-950/80 border border-amber-800/80 px-3 py-1.5 rounded-xl shadow-inner\">\n                <i class=\"fa-solid fa-key text-amber-400 text-xs sm:text-sm\"><\/i>\n                <span id=\"scoreText\" class=\"font-extrabold text-sm text-amber-200\">0<\/span>\n                <span class=\"text-[10px] text-amber-400/70 font-bold uppercase hidden sm:inline\">SOLVED<\/span>\n            <\/div>\n\n            <button onclick=\"toggleSpeech()\" id=\"speechBtn\" class=\"p-2.5 rounded-xl bg-amber-950 border border-amber-800 hover:bg-amber-900 text-amber-300 text-sm transition\" title=\"Toggle Grandfather Voice\">\n                <i id=\"speechIcon\" class=\"fa-solid fa-volume-high text-amber-400\"><\/i>\n            <\/button>\n        <\/div>\n    <\/header>\n\n    <!-- Main Content Frame -->\n    <main class=\"flex-1 px-4 lg:px-8 py-8 max-w-4xl mx-auto w-full flex flex-col justify-center\">\n\n        <!-- Welcome / Category Home Screen -->\n        <div id=\"homeScreen\" class=\"space-y-8\">\n            <div class=\"wood-panel rounded-3xl p-6 sm:p-10 text-center relative overflow-hidden shadow-2xl\">\n                <div class=\"inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-900/60 border border-amber-600/50 text-amber-300 text-xs font-semibold mb-4\">\n                    <i class=\"fa-solid fa-book-bookmark text-amber-400\"><\/i>\n                    <span>Gather 'Round the Fireplace<\/span>\n                <\/div>\n                \n                <h1 class=\"text-3xl sm:text-5xl font-extrabold vintage-font text-amber-100 mb-4 leading-tight\">\n                    Timeless Riddles passed down through <span class=\"text-amber-400\">Generations<\/span>\n                <\/h1>\n                \n                <p class=\"text-sm sm:text-base text-amber-200/80 max-w-2xl mx-auto mb-8 leading-relaxed\">\n                    Welcome to the Attic! Grab your grandchild or grandparent, put on your thinking caps, and solve the ancient brain teasers, folklore riddles, and classic trick questions of yesterday.\n                <\/p>\n\n                <!-- Big Action Buttons -->\n                <div class=\"flex flex-col sm:flex-row justify-center items-center gap-4\">\n                    <button onclick=\"startRiddleGame('all')\" class=\"w-full sm:w-auto px-8 py-4 bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-amber-950 font-black rounded-2xl text-base transition shadow-xl shadow-amber-900/50 flex items-center justify-center space-x-3 border border-amber-400\">\n                        <i class=\"fa-solid fa-play text-amber-950\"><\/i>\n                        <span>Start Grandpa's Storybook Game<\/span>\n                    <\/button>\n                    \n                    <button onclick=\"pickRandomRiddle()\" class=\"w-full sm:w-auto px-6 py-4 bg-warm-900 hover:bg-warm-800 text-amber-200 font-bold rounded-2xl text-base transition border border-amber-800/80 flex items-center justify-center space-x-2\">\n                        <i class=\"fa-solid fa-shuffle text-amber-400\"><\/i>\n                        <span>Quick Random Riddle<\/span>\n                    <\/button>\n                <\/div>\n            <\/div>\n\n            <!-- Categories Selection -->\n            <div class=\"space-y-4\">\n                <h3 class=\"text-xs font-bold text-amber-400/90 uppercase tracking-wider flex items-center space-x-2\">\n                    <i class=\"fa-solid fa-boxes-stacked\"><\/i>\n                    <span>Explore Riddle Chests<\/span>\n                <\/h3>\n                \n                <div class=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4\" id=\"categoryGrid\">\n                    <!-- Populated via JS -->\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <!-- Interactive Riddle Game Screen -->\n        <div id=\"gameScreen\" class=\"hidden space-y-6\">\n            <!-- Navigation Header -->\n            <div class=\"flex items-center justify-between bg-warm-900/80 p-4 rounded-2xl border border-amber-900/60\">\n                <button onclick=\"showHomeScreen()\" class=\"px-3.5 py-2 rounded-xl bg-amber-950 hover:bg-amber-900 border border-amber-800 text-amber-300 text-xs font-bold transition flex items-center space-x-2\">\n                    <i class=\"fa-solid fa-house\"><\/i>\n                    <span>Attic Home<\/span>\n                <\/button>\n                <div class=\"text-center\">\n                    <span id=\"currentCategoryBadge\" class=\"text-[10px] font-black uppercase text-amber-400 bg-amber-900/60 px-2.5 py-1 rounded-full border border-amber-700/50\">FOLKLORE<\/span>\n                <\/div>\n                <div class=\"text-xs font-extrabold text-amber-300\">\n                    Riddle <span id=\"riddleNum\">1<\/span> / <span id=\"totalRiddles\">10<\/span>\n                <\/div>\n            <\/div>\n\n            <!-- Paper Riddle Card -->\n            <div class=\"paper-card rounded-3xl p-6 sm:p-10 border-4 border-amber-800/40 relative overflow-hidden space-y-6\">\n                <!-- Grandpa Quote Tagline -->\n                <div class=\"flex items-center justify-between text-xs font-bold text-amber-900/70 border-b border-amber-800/20 pb-3\">\n                    <span class=\"flex items-center space-x-2\">\n                        <i class=\"fa-solid fa-user-ninja text-amber-800\"><\/i>\n                        <span>Grandpa asks:<\/span>\n                    <\/span>\n                    <button onclick=\"readRiddleAloud()\" class=\"text-amber-900 hover:text-amber-950 font-extrabold flex items-center space-x-1\">\n                        <i class=\"fa-solid fa-volume-high\"><\/i>\n                        <span>Read Aloud<\/span>\n                    <\/button>\n                <\/div>\n\n                <!-- Riddle Text -->\n                <h2 id=\"riddleQuestion\" class=\"typewriter-font text-xl sm:text-3xl font-bold leading-relaxed text-amber-950\">\n                    \"I have cities, but no houses. I have mountains, but no trees. I have water, but no fish. What am I?\"\n                <\/h2>\n\n                <!-- Input Answer Form -->\n                <form onsubmit=\"handleAnswerSubmit(event)\" class=\"space-y-4 pt-2\">\n                    <div class=\"relative\">\n                        <input type=\"text\" id=\"userAnswerInput\" placeholder=\"Type your answer here...\" \n                            class=\"w-full bg-amber-100/90 border-2 border-amber-800/40 rounded-2xl py-4 px-5 text-amber-950 font-bold text-lg placeholder-amber-900/40 focus:outline-none focus:border-amber-800 transition\"\n                            autocomplete=\"off\" required>\n                        <button type=\"submit\" class=\"absolute right-2 top-2 bottom-2 px-6 bg-amber-800 hover:bg-amber-900 text-amber-100 font-extrabold rounded-xl text-sm transition flex items-center space-x-2\">\n                            <span>Check<\/span>\n                            <i class=\"fa-solid fa-check\"><\/i>\n                        <\/button>\n                    <\/div>\n                <\/form>\n\n                <!-- Options / Hint Controls -->\n                <div class=\"flex flex-wrap items-center justify-between gap-3 pt-2\">\n                    <button id=\"hintBtn\" onclick=\"revealHint()\" class=\"px-4 py-2 bg-amber-200/80 hover:bg-amber-300/80 text-amber-950 font-extrabold rounded-xl text-xs transition border border-amber-800/30 flex items-center space-x-2\">\n                        <i class=\"fa-solid fa-lightbulb text-amber-700\"><\/i>\n                        <span>Grandpa's Hint<\/span>\n                    <\/button>\n\n                    <button onclick=\"toggleMultipleChoice()\" id=\"mcToggleBtn\" class=\"px-4 py-2 bg-amber-200/80 hover:bg-amber-300/80 text-amber-950 font-extrabold rounded-xl text-xs transition border border-amber-800/30 flex items-center space-x-2\">\n                        <i class=\"fa-solid fa-list-check text-amber-800\"><\/i>\n                        <span>Show Options<\/span>\n                    <\/button>\n                <\/div>\n\n                <!-- Hint Box -->\n                <div id=\"hintBox\" class=\"hidden p-4 rounded-2xl bg-amber-200/60 border border-amber-800/30 text-amber-950 text-sm leading-relaxed\">\n                    <i class=\"fa-solid fa-quote-left text-amber-800 mr-2\"><\/i>\n                    <span id=\"hintText\">Grandpa's clue will appear here...<\/span>\n                <\/div>\n\n                <!-- Multiple Choice Grid (Hidden by default) -->\n                <div id=\"multipleChoiceGrid\" class=\"hidden grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2\">\n                    <!-- Option buttons populated by JS -->\n                <\/div>\n\n                <!-- Feedback Box -->\n                <div id=\"feedbackBox\" class=\"hidden p-5 rounded-2xl border-2 text-sm leading-relaxed transition\">\n                    <div class=\"flex items-center space-x-2 font-black text-lg mb-1\" id=\"feedbackHeader\">\n                        <i id=\"feedbackIcon\" class=\"fa-solid\"><\/i>\n                        <span id=\"feedbackTitle\">Title<\/span>\n                    <\/div>\n                    <div id=\"feedbackText\" class=\"font-bold text-base\">Explanation...<\/div>\n                <\/div>\n\n                <!-- Next Button -->\n                <div class=\"flex justify-end pt-2\">\n                    <button id=\"nextRiddleBtn\" onclick=\"nextRiddle()\" class=\"hidden px-7 py-3 rounded-xl bg-amber-900 hover:bg-amber-950 text-amber-100 font-extrabold text-sm shadow-xl transition flex items-center space-x-2\">\n                        <span>Next Riddle<\/span>\n                        <i class=\"fa-solid fa-arrow-right\"><\/i>\n                    <\/button>\n                <\/div>\n            <\/div>\n        <\/div>\n\n        <!-- Game Completed Screen -->\n        <div id=\"completedScreen\" class=\"hidden wood-panel p-8 sm:p-12 rounded-3xl text-center space-y-6\">\n            <div class=\"w-20 h-20 mx-auto rounded-full bg-amber-500/20 border-2 border-amber-400 flex items-center justify-center text-amber-300 text-4xl float-anim\">\n                <i class=\"fa-solid fa-trophy\"><\/i>\n            <\/div>\n            \n            <h2 class=\"vintage-font text-3xl sm:text-5xl font-black text-amber-100\">RIDDLE MASTERS! \ud83c\udf89<\/h2>\n            <p id=\"completedSubText\" class=\"text-amber-200/90 text-base max-w-md mx-auto leading-relaxed\">\n                You and Grandpa solved all the old classic riddles in this chest!\n            <\/p>\n\n            <!-- Score Summary -->\n            <div class=\"bg-warm-900/90 border border-amber-800 p-6 rounded-2xl max-w-xs mx-auto text-center space-y-1\">\n                <div class=\"text-xs text-amber-400 font-bold uppercase tracking-wider\">RIDDLES SOLVED<\/div>\n                <div id=\"finalScoreVal\" class=\"text-4xl font-black text-amber-200\">10 / 10<\/div>\n            <\/div>\n\n            <div class=\"flex flex-col sm:flex-row justify-center gap-4 pt-4\">\n                <button onclick=\"showHomeScreen()\" class=\"px-6 py-3.5 bg-amber-700 hover:bg-amber-600 text-amber-950 font-black rounded-xl text-sm transition\">\n                    Back to Attic Chests\n                <\/button>\n            <\/div>\n        <\/div>\n\n    <\/main>\n\n    <!-- App Sound Synth & Riddle Logic -->\n    <script>\n        // Old Classic Riddles Database\n        const RIDDLES_DB = [\n            {\n                id: 1,\n                category: \"folklore\",\n                categoryName: \"Folklore & Nature\",\n                question: \"I have cities, but no houses. I have mountains, but no trees. I have water, but no fish. What am I?\",\n                answers: [\"map\", \"a map\"],\n                options: [\"A Map\", \"A Globe\", \"A Picture\", \"A Book\"],\n                hint: \"Grandpa holds it unfolded in his hands when driving on long road trips!\",\n                explanation: \"A Map shows all geographical features drawn on paper, but contains no physical houses or real water.\"\n            },\n            {\n                id: 2,\n                category: \"folklore\",\n                categoryName: \"Folklore & Nature\",\n                question: \"What comes down, but never goes up?\",\n                answers: [\"rain\", \"rain drop\", \"snow\"],\n                options: [\"Rain\", \"Smoke\", \"A Bird\", \"The Sun\"],\n                hint: \"Look out the window on a stormy afternoon when you drink warm cocoa!\",\n                explanation: \"Rain falls from the clouds down to the ground, but never rises back down!\"\n            },\n            {\n                id: 3,\n                category: \"household\",\n                categoryName: \"Old House Objects\",\n                question: \"I have a head and a tail, but no body. What am I?\",\n                answers: [\"coin\", \"a coin\", \"penny\", \"quarter\"],\n                options: [\"A Coin\", \"A Nail\", \"A Needle\", \"A Clock\"],\n                hint: \"Check Grandpa's pocket change jar on the nightstand!\",\n                explanation: \"A coin has a 'heads' side and a 'tails' side, but no physical body!\"\n            },\n            {\n                id: 4,\n                category: \"household\",\n                categoryName: \"Old House Objects\",\n                question: \"I have hands, but I cannot clap. What am I?\",\n                answers: [\"clock\", \"a clock\", \"watch\"],\n                options: [\"A Clock\", \"A Glove\", \"A Mirror\", \"A Chair\"],\n                hint: \"It hangs on the living room wall and tick-tocks all day long.\",\n                explanation: \"A clock has an hour hand and a minute hand to tell time, but cannot clap!\"\n            },\n            {\n                id: 5,\n                category: \"trick\",\n                categoryName: \"Grandpa's Trick Questions\",\n                question: \"What has to be broken before you can use it?\",\n                answers: [\"egg\", \"an egg\"],\n                options: [\"An Egg\", \"A Coconut\", \"A Lock\", \"A Glowstick\"],\n                hint: \"Grandpa cracks this into the skillet when making Sunday breakfast pancakes!\",\n                explanation: \"You must break the outer shell of an egg to cook or bake with it.\"\n            },\n            {\n                id: 6,\n                category: \"trick\",\n                categoryName: \"Grandpa's Trick Questions\",\n                question: \"What gets wetter and wetter the more it dries?\",\n                answers: [\"towel\", \"a towel\"],\n                options: [\"A Towel\", \"A Sponge\", \"The Sun\", \"A Cloud\"],\n                hint: \"You use it right after taking a bath or swimming in the lake!\",\n                explanation: \"A towel dries your body by absorbing water, making the towel itself wet!\"\n            },\n            {\n                id: 7,\n                category: \"wordplay\",\n                categoryName: \"Old Word Teasers\",\n                question: \"What month of the year has 28 days?\",\n                answers: [\"all of them\", \"all\", \"every month\", \"all months\"],\n                options: [\"All of them\", \"February only\", \"January\", \"None\"],\n                hint: \"Think carefully! February has 28 days, but do other months have 28 days too?\",\n                explanation: \"All 12 months have at least 28 days in them!\"\n            },\n            {\n                id: 8,\n                category: \"wordplay\",\n                categoryName: \"Old Word Teasers\",\n                question: \"What is full of holes but still holds water?\",\n                answers: [\"sponge\", \"a sponge\"],\n                options: [\"A Sponge\", \"A Bucket\", \"A Net\", \"A Straw\"],\n                hint: \"It sits by the kitchen sink to wash grandma's dinner dishes!\",\n                explanation: \"A sponge is full of porous holes, yet retains water inside its material.\"\n            },\n            {\n                id: 9,\n                category: \"folklore\",\n                categoryName: \"Folklore & Nature\",\n                question: \"What goes up when rain comes down?\",\n                answers: [\"umbrella\", \"an umbrella\"],\n                options: [\"An Umbrella\", \"A Kite\", \"A Balloon\", \"A Roof\"],\n                hint: \"You open it up over your head so you don't get soaked outside!\",\n                explanation: \"An umbrella is opened upward to shield you when rain falls downward.\"\n            },\n            {\n                id: 10,\n                category: \"household\",\n                categoryName: \"Old House Objects\",\n                question: \"I have one eye, but I cannot see. What am I?\",\n                answers: [\"needle\", \"a needle\", \"sewing needle\"],\n                options: [\"A Needle\", \"A Hurricane\", \"A Potato\", \"A Button\"],\n                hint: \"Grandma passes thread through it when mending an old sweater!\",\n                explanation: \"A sewing needle has an 'eye' hole for thread, but no eyesight!\"\n            }\n        ];\n\n        // Categories Configuration\n        const CATEGORIES = [\n            { id: \"all\", title: \"Grandpa's Full Chest\", icon: \"fa-gem\", count: RIDDLES_DB.length, desc: \"Play all traditional riddles mixed together\" },\n            { id: \"folklore\", title: \"Folklore & Nature\", icon: \"fa-tree\", count: 3, desc: \"Nature, storms, maps & classic ancient lore\" },\n            { id: \"household\", title: \"Old House Objects\", icon: \"fa-couch\", count: 3, desc: \"Clocks, needles, coins & vintage house tools\" },\n            { id: \"trick\", title: \"Grandpa's Tricks\", icon: \"fa-hat-wizard\", count: 2, desc: \"Fun trick questions to test quick wits\" },\n            { id: \"wordplay\", title: \"Old Word Teasers\", icon: \"fa-font\", count: 2, desc: \"Clever wordplay and double meanings\" }\n        ];\n\n        let currentCategory = \"all\";\n        let activeRiddleSet = [];\n        let currentRiddleIdx = 0;\n        let totalSolved = parseInt(localStorage.getItem('riddles_solved') || '0');\n        let soundEnabled = true;\n\n        window.onload = function() {\n            renderCategoryCards();\n            updateSolvedHeader();\n        };\n\n        function updateSolvedHeader() {\n            document.getElementById('scoreText').innerText = totalSolved;\n            localStorage.setItem('riddles_solved', totalSolved);\n        }\n\n        function renderCategoryCards() {\n            const container = document.getElementById('categoryGrid');\n            container.innerHTML = CATEGORIES.map(cat => `\n                <div onclick=\"startRiddleGame('${cat.id}')\" class=\"wood-panel p-5 rounded-2xl cursor-pointer hover:border-amber-500 transition group flex flex-col justify-between space-y-3\">\n                    <div>\n                        <div class=\"w-10 h-10 rounded-xl bg-amber-900/80 border border-amber-600/50 flex items-center justify-center text-amber-300 text-lg mb-3 group-hover:scale-110 transition\">\n                            <i class=\"fa-solid ${cat.icon}\"><\/i>\n                        <\/div>\n                        <h4 class=\"vintage-font font-bold text-amber-100 text-base group-hover:text-amber-300 transition\">${cat.title}<\/h4>\n                        <p class=\"text-xs text-amber-300/70 mt-1 leading-normal\">${cat.desc}<\/p>\n                    <\/div>\n                    <div class=\"text-[10px] font-extrabold text-amber-400 bg-amber-950/80 border border-amber-800 px-2.5 py-1 rounded-lg w-max\">\n                        ${cat.count} RIDDLES\n                    <\/div>\n                <\/div>\n            `).join('');\n        }\n\n        function startRiddleGame(catId) {\n            currentCategory = catId;\n            if (catId === 'all') {\n                activeRiddleSet = [...RIDDLES_DB];\n            } else {\n                activeRiddleSet = RIDDLES_DB.filter(r => r.category === catId);\n            }\n\n            currentRiddleIdx = 0;\n            document.getElementById('homeScreen').classList.add('hidden');\n            document.getElementById('completedScreen').classList.add('hidden');\n            document.getElementById('gameScreen').classList.remove('hidden');\n\n            renderRiddle();\n        }\n\n        function pickRandomRiddle() {\n            const randomIdx = Math.floor(Math.random() * RIDDLES_DB.length);\n            activeRiddleSet = [RIDDLES_DB[randomIdx]];\n            currentRiddleIdx = 0;\n\n            document.getElementById('homeScreen').classList.add('hidden');\n            document.getElementById('completedScreen').classList.add('hidden');\n            document.getElementById('gameScreen').classList.remove('hidden');\n\n            renderRiddle();\n        }\n\n        function renderRiddle() {\n            const r = activeRiddleSet[currentRiddleIdx];\n\n            document.getElementById('currentCategoryBadge').innerText = r.categoryName;\n            document.getElementById('riddleNum').innerText = currentRiddleIdx + 1;\n            document.getElementById('totalRiddles').innerText = activeRiddleSet.length;\n\n            document.getElementById('riddleQuestion').innerText = `\"${r.question}\"`;\n            document.getElementById('userAnswerInput').value = '';\n            document.getElementById('userAnswerInput').disabled = false;\n\n            document.getElementById('hintBox').classList.add('hidden');\n            document.getElementById('multipleChoiceGrid').classList.add('hidden');\n            document.getElementById('feedbackBox').classList.add('hidden');\n            document.getElementById('nextRiddleBtn').classList.add('hidden');\n\n            // Render Options\n            const mcContainer = document.getElementById('multipleChoiceGrid');\n            mcContainer.innerHTML = r.options.map(opt => `\n                <button type=\"button\" onclick=\"submitMultipleChoice('${opt}')\" class=\"w-full text-left p-3.5 rounded-xl bg-amber-100/90 hover:bg-amber-200 border-2 border-amber-800/40 text-amber-950 font-bold text-sm transition flex items-center justify-between\">\n                    <span>${opt}<\/span>\n                    <i class=\"fa-regular fa-circle text-amber-800\"><\/i>\n                <\/button>\n            `).join('');\n\n            if (soundEnabled) {\n                readRiddleAloud();\n            }\n        }\n\n        function handleAnswerSubmit(e) {\n            e.preventDefault();\n            const input = document.getElementById('userAnswerInput').value.trim().toLowerCase();\n            const r = activeRiddleSet[currentRiddleIdx];\n\n            const isCorrect = r.answers.some(ans => input.includes(ans));\n            processResult(isCorrect);\n        }\n\n        function submitMultipleChoice(selectedOpt) {\n            const r = activeRiddleSet[currentRiddleIdx];\n            const isCorrect = r.answers.some(ans => selectedOpt.toLowerCase().includes(ans));\n            processResult(isCorrect);\n        }\n\n        function processResult(isCorrect) {\n            const r = activeRiddleSet[currentRiddleIdx];\n            document.getElementById('userAnswerInput').disabled = true;\n\n            const fbBox = document.getElementById('feedbackBox');\n            const fbIcon = document.getElementById('feedbackIcon');\n            const fbTitle = document.getElementById('feedbackTitle');\n            const fbText = document.getElementById('feedbackText');\n\n            fbBox.classList.remove('hidden', 'bg-emerald-200', 'border-emerald-700', 'text-emerald-950', 'bg-rose-200', 'border-rose-700', 'text-rose-950');\n\n            if (isCorrect) {\n                totalSolved++;\n                updateSolvedHeader();\n                triggerConfetti();\n\n                fbBox.classList.add('bg-emerald-200', 'border-emerald-700', 'text-emerald-950');\n                fbIcon.className = \"fa-solid fa-circle-check text-emerald-800\";\n                fbTitle.innerText = \"Hooray! You Got It Right!\";\n                fbText.innerText = r.explanation;\n            } else {\n                fbBox.classList.add('bg-rose-200', 'border-rose-700', 'text-rose-950');\n                fbIcon.className = \"fa-solid fa-circle-xmark text-rose-800\";\n                fbTitle.innerText = \"Nice Try! The Answer is: \" + r.options[0];\n                fbText.innerText = r.explanation;\n            }\n\n            document.getElementById('nextRiddleBtn').classList.remove('hidden');\n        }\n\n        function revealHint() {\n            const r = activeRiddleSet[currentRiddleIdx];\n            document.getElementById('hintText').innerText = r.hint;\n            document.getElementById('hintBox').classList.remove('hidden');\n        }\n\n        function toggleMultipleChoice() {\n            const grid = document.getElementById('multipleChoiceGrid');\n            grid.classList.toggle('hidden');\n        }\n\n        function nextRiddle() {\n            currentRiddleIdx++;\n            if (currentRiddleIdx < activeRiddleSet.length) {\n                renderRiddle();\n            } else {\n                showCompletedScreen();\n            }\n        }\n\n        function showCompletedScreen() {\n            document.getElementById('gameScreen').classList.add('hidden');\n            document.getElementById('completedScreen').classList.remove('hidden');\n            document.getElementById('finalScoreVal').innerText = `${activeRiddleSet.length} / ${activeRiddleSet.length}`;\n            triggerConfetti();\n        }\n\n        function showHomeScreen() {\n            document.getElementById('gameScreen').classList.add('hidden');\n            document.getElementById('completedScreen').classList.add('hidden');\n            document.getElementById('homeScreen').classList.remove('hidden');\n            if (window.speechSynthesis) window.speechSynthesis.cancel();\n        }\n\n        function toggleSpeech() {\n            soundEnabled = !soundEnabled;\n            document.getElementById('speechIcon').className = soundEnabled ? \"fa-solid fa-volume-high text-amber-400\" : \"fa-solid fa-volume-xmark text-rose-500\";\n            if (!soundEnabled && window.speechSynthesis) {\n                window.speechSynthesis.cancel();\n            }\n        }\n\n        function readRiddleAloud() {\n            if (!('speechSynthesis' in window)) return;\n            window.speechSynthesis.cancel();\n\n            const r = activeRiddleSet[currentRiddleIdx];\n            const utterance = new SpeechSynthesisUtterance(r.question);\n            utterance.rate = 0.9;\n            utterance.pitch = 0.9; // Lower warm pitch for Grandpa effect\n            window.speechSynthesis.speak(utterance);\n        }\n\n        function triggerConfetti() {\n            if (typeof confetti === 'function') {\n                confetti({\n                    particleCount: 80,\n                    spread: 60,\n                    origin: { y: 0.6 }\n                });\n            }\n        }\n    <\/script>\n<\/body>\n<\/html>"}, {"id": "ttt", "t": "Tic Tac Toe", "cat": "Board", "e": "\u274c", "g": "#0ea5e9,#0c4a6e", "html": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;gap:12px;padding:12px}\nbutton{cursor:pointer;border:0;border-radius:10px;background:#6366f1;color:#fff;padding:.6rem 1.1rem;font-weight:700;font-size:1rem}h2{margin:0}.m{color:#94a3b8}<\/style><\/head><body><h2>Tic Tac Toe<\/h2><div class=\"m\" id=\"s\">You are X<\/div>\n<div id=\"b\" style=\"display:grid;grid-template-columns:repeat(3,90px);gap:8px\"><\/div><button onclick=\"init()\">New game<\/button>\n<script>\nconst L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let B,over;\nconst win=b=>{for(const[a,c,d]of L)if(b[a]&&b[a]==b[c]&&b[a]==b[d])return b[a];return b.every(x=>x)?'T':null};\nfunction mm(b,p){const w=win(b);if(w)return w=='O'?1:w=='X'?-1:0;let best=p=='O'?-9:9;\nfor(let i=0;i<9;i++)if(!b[i]){b[i]=p;const v=mm(b,p=='O'?'X':'O');b[i]='';best=p=='O'?Math.max(best,v):Math.min(best,v)}return best}\nfunction ai(){let bi=-1,bv=-9;for(let i=0;i<9;i++)if(!B[i]){B[i]='O';const v=mm(B,'X');B[i]='';if(v>bv){bv=v;bi=i}}B[bi]='O'}\nfunction draw(){const e=document.getElementById('b');e.innerHTML='';B.forEach((v,i)=>{const d=document.createElement('button');\nd.style.cssText='height:90px;font-size:2.4rem;background:#1e293b;color:'+(v=='X'?'#38bdf8':'#f472b6');d.textContent=v;d.onclick=()=>play(i);e.appendChild(d)});\nconst w=win(B);if(w){over=1;s.textContent=w=='T'?\"It's a draw!\":(w=='X'?'You win! \ud83c\udf89':'Computer wins')}}\nfunction play(i){if(over||B[i])return;B[i]='X';if(!win(B))ai();draw()}\nfunction init(){B=Array(9).fill('');over=0;s.textContent='You are X (computer is unbeatable)';draw()}init()\n<\/script><\/body><\/html>"}, {"id": "mem", "t": "Memory Match", "cat": "Puzzle", "e": "\ud83c\udccf", "g": "#ec4899,#831843", "html": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<style>*{box-sizing:border-box;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;gap:12px;padding:12px}\nbutton{cursor:pointer;border:0;border-radius:10px;background:#6366f1;color:#fff;padding:.6rem 1.1rem;font-weight:700;font-size:1rem}h2{margin:0}.m{color:#94a3b8}<\/style><\/head><body><h2>Memory Match<\/h2><div class=\"m\" id=\"s\">Moves: 0<\/div>\n<div id=\"b\" style=\"display:grid;grid-template-columns:repeat(4,72px);gap:8px\"><\/div><button onclick=\"init()\">New game<\/button>\n<script>\nlet f,lock,mv,pairs;const E=['\ud83c\udf4e','\ud83d\ude80','\ud83d\udc31','\u26bd','\ud83c\udfb8','\ud83c\udf08','\ud83c\udf55','\ud83e\udd84'];\nfunction init(){const a=[...E,...E].sort(()=>Math.random()-.5);f=null;lock=0;mv=0;pairs=0;s.textContent='Moves: 0';b.innerHTML='';\na.forEach(v=>{const d=document.createElement('button');d.style.cssText='height:72px;font-size:2rem;background:#334155';d.dataset.v=v;d.textContent='?';d.onclick=()=>flip(d);b.appendChild(d)})}\nfunction flip(d){if(lock||d.disabled||d==f)return;d.textContent=d.dataset.v;d.style.background='#6366f1';\nif(!f){f=d;return}mv++;s.textContent='Moves: '+mv;\nif(f.dataset.v==d.dataset.v){f.disabled=d.disabled=true;f.style.background=d.style.background='#16a34a';f=null;if(++pairs==8)s.textContent='You won in '+mv+' moves! \ud83c\udf89'}\nelse{lock=1;const p=f;f=null;setTimeout(()=>{[p,d].forEach(x=>{x.textContent='?';x.style.background='#334155'});lock=0},700)}}\ninit()\n<\/script><\/body><\/html>"}, {"id": "g2048", "t": "2048", "cat": "Puzzle", "e": "\ud83d\udd22", "g": "#f59e0b,#b45309", "html": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,user-scalable=no\">\n<style>*{box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#1e293b,#0f172a 70%);color:#f8fafc;gap:12px;padding:12px;user-select:none}\nbutton{cursor:pointer;border:0;border-radius:12px;background:#6366f1;color:#fff;padding:.6rem 1.2rem;font-weight:700;font-size:1rem}h2{margin:0}.m{color:#94a3b8}#b{display:grid;grid-template-columns:repeat(4,var(--t));gap:8px;background:#1e293b;padding:8px;border-radius:14px;--t:min(20vw,84px);touch-action:none}\n.t{height:var(--t);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.5rem;transition:background .1s}<\/style><\/head><body><h2>2048<\/h2><div class=\"m\">Score <b id=\"s\">0<\/b> \u00b7 Best <b id=\"bs\">0<\/b><\/div><div id=\"b\"><\/div><div class=\"m\" id=\"msg\">Arrow keys / WASD / swipe to merge tiles<\/div><button onclick=\"init()\">New game<\/button>\n<script>\nlet g,sc,bst=0,won=0;try{bst=+localStorage.getItem('b2048')||0}catch(e){}\nconst COL={0:'#334155',2:'#e2e8f0',4:'#fde68a',8:'#fdba74',16:'#fb923c',32:'#f87171',64:'#ef4444',128:'#fcd34d',256:'#facc15',512:'#a3e635',1024:'#34d399',2048:'#38bdf8'};\nfunction add(){const e=g.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)g[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}\nfunction init(){g=Array(16).fill(0);sc=0;won=0;add();add();draw();msg.textContent='Arrow keys / WASD / swipe to merge tiles'}\nfunction slide(l){const a=l.filter(v=>v),r=[];for(let i=0;i<a.length;i++){if(a[i]==a[i+1]){r.push(a[i]*2);sc+=a[i]*2;i++}else r.push(a[i])}while(r.length<4)r.push(0);return r}\nfunction mv(d){const old=g.join();for(let k=0;k<4;k++){const idx=[0,1,2,3].map(j=>d<2?k*4+j:j*4+k);if(d%2)idx.reverse();const r=slide(idx.map(i=>g[i]));idx.forEach((i,j)=>g[i]=r[j])}\nif(g.join()!=old){add();draw()}}\nfunction dead(){if(g.includes(0))return false;for(let i=0;i<16;i++){if(i%4<3&&g[i]==g[i+1])return false;if(i<12&&g[i]==g[i+4])return false}return true}\nfunction draw(){b.innerHTML=g.map(v=>`<div class=\"t\" style=\"background:${COL[v]||'#7c3aed'};color:${v>4?'#fff':'#1e293b'};font-size:${v>999?'1.1rem':v>99?'1.3rem':'1.6rem'}\">${v||''}<\/div>`).join('');\nif(sc>bst){bst=sc;try{localStorage.setItem('b2048',bst)}catch(e){}}s.textContent=sc;bs.textContent=bst;\nif(!won&&g.includes(2048)){won=1;msg.textContent='\ud83c\udf89 You made 2048! Keep going!'}else if(dead())msg.textContent='Game over \u2014 no moves left'}\naddEventListener('keydown',e=>{const d={ArrowLeft:0,a:0,ArrowRight:1,d:1,ArrowUp:2,w:2,ArrowDown:3,s:3}[e.key];if(d!==undefined){e.preventDefault();mv(d)}});\nlet sx,sy;b.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};\nb.ontouchend=e=>{const a=e.changedTouches[0].clientX-sx,c=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(a),Math.abs(c))<20)return;mv(Math.abs(a)>Math.abs(c)?(a>0?1:0):(c>0?3:2))};\ninit()\n<\/script><\/body><\/html>"}, {"id": "c4", "t": "Connect 4", "cat": "Board", "e": "\ud8 b[i]==2)a++;else if(b[i]==1)h++});if(!h)s+=a==3?50:a==2?5:0;else if(!a)s-=h==3?60:h==2?5:0}return s}\nfunction mm(b,d,al,be,p){if(won(b,2))return 1e4+d;if(won(b,1))return -1e4-d;if(!d||b.every(v=>v))return ev(b);\nconst cols=[3,2,4,1,5,0,6];let best=p==2?-1e9:1e9;\nfor(const c of cols){if(b[c])continue;const n=b.slice();drop(n,c,p);const v=mm(n,d-1,al,be,p==2?1:2);\nif(p==2){best=Math.max(best,v);al=Math.max(al,v)}else{best=Math.min(best,v);be=Math.min(be,v)}if(al>=be)break}return best}\nfunction ai(){let bc=-1,bv=-1e9;for(const c of [3,2,4,1,5,0,6]){if(B[c])continue;const n=B.slice();drop(n,c,2);const v=mm(n,4,-1e9,1e9,1);if(v>bv){bv=v;bc=c}}if(bc>=0)drop(B,bc,2)}\nfunction save(){try{localStorage.setItem('c4',JSON.stringify(rec))}catch(e){}rc.textContent='Record vs computer: '+rec.w+' wins \u00b7 '+rec.l+' losses'}\nfunction draw(){const w=won(B,1)||won(B,2);b.innerHTML=B.map((v,i)=>`<div class=\"k${v?' p'+v:''}${w&&w.includes(i)?' w':''}\"><\/div>`).join('');\nif(w){over=1;const me=B[w[0]]==1;s.textContent=me?'You win! \ud83c\udf89':'Computer wins';me?rec.w++:rec.l++;save()}else if(B.every(v=>v)){over=1;s.textContent=\"It's a draw!\"}}\nfunction play(c){if(over||B[c])return;drop(B,c,1);draw();if(over)return;s.textContent='Thinking\u2026';setTimeout(()=>{ai();draw();if(!over)s.textContent='Your turn'},250)}\nfunction init(){B=Array(42).fill(0);over=0;s.textContent='You are red \u2014 drop a disc!';h.innerHTML=[...Array(W).keys()].map(c=>`<button onclick=\"play(${c})\">\u25bc<\/button>`).join('');draw();save()}\ninit()\n<\/script><\/body><\/html>"}, {"id": "ms", "t": "Minesweeper", "cat": "Puzzle", "e": "\ud83d\udca3", "g": "#64748b,#1e293b", "html": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,user-scalable=no\">\n<style>*{box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-it c.o||c.f)return;c.o=1;if(!c.m&&!c.n)nb(i).forEach(reveal)}\nfunction act(i,flag){if(over)return;const c=g[i];\n if(flag||flagMode){if(!c.o){c.f=!c.f;draw()}return}\n if(c.f||c.o)return;\n if(first){place(i);first=0;t0=Date.now();tm=setInterval(()=>time.textContent=(Date.now()-t0)/1000|0,250)}\n reveal(i);\n if(c.m){over=1;clearInterval(tm);g.forEach(x=>{if(x.m)x.o=1});msg.textContent='\ud83d\udca5 Boom! Game over';draw();b.children[i].classList.add('x');return}\n if(g.every(x=>x.m||x.o)){over=1;clearInterval(tm);const s=(Date.now()-t0)/1000|0;msg.textContent='\ud83c\udf89 Cleared in '+s+'s!';if(!best||s<best){best=s;try{localStorage.setItem('ms',s)}catch(e){}msg.textContent+=' New best!'}}\n draw()}\nfunction draw(){fl.textContent=M-g.filter(c=>c.f).length;b.innerHTML='';g.forEach((c,i)=>{const e=document.createElement('button');\n if(c.o){e.className='o';if(c.m)e.textContent='\ud83d\udca3';else if(c.n){e.textContent=c.n;e.style.color=COL[c.n]}}else if(c.f)e.textContent='\ud83d\udea9';\n e.onclick=()=>act(i);e.oncontextmenu=ev=>{ev.preventDefault();act(i,1)};b.appendChild(e)})}\ninit()\n<\/script><\/body><\/html>"}, {"id": "flap", "t": "Sky Flap", "cat": "Arcade", "e": "\ud83d\udc24", "g": "#38bdf8,#1d4ed8", "html": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,user-scalable=no\">\n<style>*{box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#1e293b,#0f172a 70%);color:#f8fafc;gap:12px;padding:12px;user-select:none}\nbutton{cursor:pointer;border:0;border-radius:12px;background:#6366f1;color:#fff;padding:.6rem 1.2rem;font-weight:700;font-size:1rem}h2{margin:0}.m{color:#94a3b8}canvas{height:min(78vh,520px);aspect-ratio:2/3;border-radius:16px;border:2px solid #ffffff1a;touch-action:none;box-shadow:0 10px 4 nt-size:2rem\">\u270c\ufe0f<\/button><\/div><div class=\"m\" id=\"t\"><\/div>\n<script>\nconst E=['\u270a','\u270b','\u270c\ufe0f'];let w=0,l=0,d=0;\nfunction go(i){const c=Math.random()*3|0,o=(i-c+3)%3;f.textContent=E[i]+' vs '+E[c];if(o==0){d++;r.textContent=\"It's a draw\"}else if(o==1){w++;r.textContent='You win! \ud83c\udf89'}else{l++;r.textContent='Computer wins'}t.textContent='Wins '+w+' \u00b7 Losses '+l+' \u00b7 Draws '+d}\n<\/script><\/body><\/html>"}, {"id": "rt", "t": "Reaction Test", "cat": "Arcade", "e": "\u26a1", "g": "#10b981,#064e3b", "html": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,user-scalable=no\">\n<style>*{box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#1e293b,#0f172a 70%);color:#f8fafc;gap:12px;padding:12px;user-select:none}\nbutton{cursor:pointer;border:0;border-radius:12px;background:#6366f1;color:#fff;padding:.6rem 1.2rem;font-weight:700;font-size:1rem}h2{margin:0}.m{color:#94a3b8}#z{width:min(90vw,420px);height:260px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;cursor:pointer;background:#1d4ed8;text-align:center;padding:12px}<\/style><\/head><body><h2>Reaction Test<\/h2><div id=\"z\" onpointerdown=\"tap()\">Tap to start<\/div><div class=\"m\" id=\"s\"><\/div>\n<script>\nlet st='idle',t0,to,best=0;try{best=+localStorage.getItem('rt')||0}catch(e){}\nfunction set(c,t){z.style.background=c;z.textContent=t}\nfunction tap(){if(st=='idle'){st='wait';set('#dc2626','Wait for green...');to=setTimeout(()=>{st='go';t0=performance.now();set('#16a34a','TAP NOW!')},1200+Math.random()*2800)}\n else if(st=='wait'){clearTimeout(to);st='idle';set('#1d4ed8','Too soon! Tap to try again')}\n else{const ms=Math.round(performance.now()-t0);st='idle';if(!best||ms<best){best=ms;try{localStorage.setItem('rt',ms)}catch(e){}}set('#1d4ed8',ms+' ms - tap to retry');s.textContent='Best: '+best+' ms'}}\n<\/script><\/body><\/html>"}, {"id": "snake", "t": "Snake", "cat": "Arcade", "e": "\ud83d\udfe2", "g": "#22c55e,#052e16", "html": "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,user-scalable=no\">\n<style>\n:root{--w:min(92vw,460px,calc(100vh - 130px))}\n@media(pointer:coarse){:root{--w:min(92vw,460px,calc(100vh - 270px))}}\n*{box-sizing:border-box;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;height:100%}\nbody{background:radial-gradient(circle at 50% 0,#1e293b,#0f172a 70%);color:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px;overflow:hidden;user-select:none}\n.hud{display:flex;gap:8px;width:var(--w);align-items:stretch}\n.hud div{flex:1;background:#1e293b;border:1px solid #ffffff14;border-radius:12px;padding:5px 8px;text-align:center}\n.hud small{display:block;color:#94a3b8;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase}.hud b{font-size:1.2rem}\n.hud button{flex:0 0 44px;font-size:1.1rem;padding:0;background:#1e293b;border:1px solid #ffffff14}\nbutton{cursor:pointer;border:0;border-radius:12px;background:#6366f1;color:#fff;font-weight:700;font-size:1rem;padding:.65rem 1.3rem}\nbutton:active{transform:scale(.96)}\n#wrap{position:relative;width:var(--w);aspect-ratio:1}\ncanvas{width:100%;height:100%;border-radius:16px;border:2px solid #ffffff1a;box-shadow:0 10px 40px #0008;display:block}\n.ov{position:absolute;inset:0;border-radius:16px;background:#020617e0;backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:14px}\n.ov.h{display:none}.ov h1{margin:0;font-size:2rem}.m{color:#94a3b8;font-size:.85rem}\n.seg{display:flex;background:#1e293b;border-radius:12px;padding:3px;gap:3px}\n.seg button{background:none;color:#94a3b8;padding:.45rem .9rem;font-size:.85rem}.seg button.on{background:#6366f1;color:#fff}\n.pad{display:none;grid-template-columns:repeat(3,58px);gap:6px}\n@media(pointer:coarse){.pad{display:grid}}\n.pad button{height:50px;background:#1e293b;border:1px solid #ffffff14}\n<\/style><\/head><body>\n<div class=\"hud\"><div><small>Score<\/small><b id=\"sc\">0<\/b><\/div><div><small>Best<\/small><b id=\"bs\">0<\/b><\/div><div><small>Level<\/small><b id=\"lv\">1<\/b><\/div><button onclick=\"snd=!snd;this.textContent=snd?'\ud83d\udd0a':'\ud83d\udd07'\">\ud83d\udd0a<\/button><button onclick=\"pause()\">\u23f8<\/button><\/div>\n<div id=\"wrap\"><canvas id=\"c\"><\/canvas><div class=\"ov\" id=\"ov\"><\/div><\/div>\n<div class=\"pad\"><span><\/span><button onclick=\"turn(0,-1)\">\u25b2<\/button><span><\/span><button onclick=\"turn(-1,0)\">\u25c0<\/button><button onclick=\"turn(0,1)\">\u25bc<\/button><button onclick=\"turn(1,0)\">\u25b6<\/button><\/div>\n<script>\nconst N=20,S=20,C=document.getElementById('c'),x=C.getContext('2d'),$=id=>document.getElementById(id),dpr=Math.min(devicePixelRatio||1,2);\nC.width=C.height=N*S*dpr;x.scale(dpr,dpr);\nconst SPEED=[150,115,80],NAMES=['Easy','Normal','Hard'];\nlet diff=1,wrap=false,state='menu',snd=true,ac,best={},sn=[{x:10,y:10}],dir={x:1,y:0},q=[],food,bonus,score=0,eaten=0,acc=0,last=0,parts=[];\ntry{best=JSON.parse(localStorage.getItem('snk2')||'{}')}catch(e){}\nconst key=()=>diff+(wrap?'w':'s'),lvl=()=>1+(eaten/5|0),delay=()=>Math.max(45,SPEED[diff]-(lvl()-1)*6);\nfunction beep(f,d=.09){if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}\nfunction free(){let p;do p={x:Math.random()*N|0,y:Math.random()*N|0};while(sn.some(s=>s.x==p.x&&s.y==p.y)||(food&&food.x==p.x&&food.y==p.y)||(bonus&&bonus.x==p.x&&bonus.y==p.y));return p}\nfunction upd(){$('sc').textContent=score;$('bs').textContent=best[key()]||0;$('lv').textContent=lvl()}\nfunction show(h){$('ov').innerHTML=h;$('ov').classList.remove('h')}\nfunction menu(){state='menu';upd();show(`<h1>\ud83d\udc0d Snake<\/h1>\n<div class=\"seg\">${NAMES.map((n,i)=>`<button class=\"${i==diff?'on':''}\" onclick=\"diff=${i};menu()\">${n}<\/button>`).join('')}<\/div>\n<div class=\"seg\"><button class=\"${wrap?'':'on'}\" onclick=\"wrap=false;menu()\">Solid walls<\/button><button class=\"${wrap?'on':''}\" onclick=\"wrap=true;menu()\">Wrap around<\/button><\/div>\n<div class=\"m\">Best (this mode): ${best[key()]||0}<\/div><button onclick=\"start()\">\u25b6 Play<\/button>\n<div class=\"m\">Arrows / WASD \u00b7 Space = pause \u00b7 M = mute<br>\ud83d\udfe1 Golden apples give +5<\/div>`)}\nfunction start(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};q=[];food=null;bonus=null;food=free();score=0;eaten=0;acc=0;parts=[];state='play';$('ov').classList.add('h');upd()}\nfunction pause(){if(state=='play'){state='pause';show('<h1>\u23f8 Paused<\/h1><button onclick=\"pause()\">\u25b6 Resume<\/button><button style=\"background:#334155\" onclick=\"menu()\">Menu<\/button>')}else if(state=='pause'){state='play';$('ov').classList.add('h')}}\nfunction die(){state='over';beep(120,.4);const k=key(),nb=score>(best[k]||0);if(nb){best[k]=score;try{localStorage.setItem('snk2',JSON.stringify(best))}catch(e){}}upd();\nshow(`<h1>Game over<\/h1><div style=\"font-size:2.4rem;font-weight:800\">${score}<\/div><div class=\"m\">${nb?'\ud83c\udfc6 New best!':'Best: '+best[k]} \u00b7 Level ${lvl()}<\/div><button onclick=\"start()\">\u21bb Play again<\/button><button style=\"background:#334155\" onclick=\"menu()\">Menu<\/button>`)}\nfunction burst(p,c){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=.5+Math.random()*2;parts.push({x:p.x*S+10,y:p.y*S+10,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c})}}\nfunction turn(a,b){if(state!='play')return;const l=q.length?q[q.length-1]:dir;if((a+l.x==0&&b+l.y==0)||(a==l.x&&b==l.y)||q.length>1)return;q.push({x:a,y:b})}\nfunction step(){\n if(q.length)dir=q.shift();\n const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};\n if(wrap){h.x=(h.x+N)%N;h.y=(h.y+N)%N}else if(h.x<0||h.y<0||h.x>=N||h.y>=N)return die();\n const isF=h.x==food.x&&h.y==food.y,isB=bonus&&h.x==bonus.x&&h.y==bonus.y,body=(isF||isB)?sn:sn.slice(0,-1);\n if(body.some(p=>p.x==h.x&&p.y==h.y))return die();\n sn.unshift(h);\n if(isF){score++;eaten++;beep(660);burst(h,'#ef4444');food=free();if(eaten%5==0&&!bonus)bonus={...free(),t:6000}}\n else if(isB){score+=5;beep(880,.15);burst(h,'#facc15');bonus=null}\n else sn.pop();\n upd()}\nfunction draw(t){\n for(let i=0;i<N;i++)for(let j=0;j<N;j++){x.fillStyle=(i+j)%2?'#0b1220':'#0e1627';x.fillRect(i*S,j*S,S,S)}\n if(food){const s=1+Math.sin(t/180)*.1;x.fillStyle='#ef4444';x.beginPath();x.arc(food.x*S+10,food.y*S+11,7*s,0,7);x.fill();x.fillStyle='#22c55e';x.fillRect(food.x*S+10,food.y*S+2,2,4)}\n if(bonus){x.save();x.shadowColor='#facc15';x.shadowBlur=14;x.fillStyle='#facc15';x.beginPath();x.arc(bonus.x*S+10,bonus.y*S+10,6+Math.sin(t/100),0,7);x.fill();x.restore();x.strokeStyle='#facc15';x.lineWidth=2;x.beginPath();x.arc(bonus.x*S+10,bonus.y*S+10,9,-1.57,-1.57+6.28*bonus.t/6000);x.stroke()}\n sn.forEach((p,i)=>{const k=i/sn.length,m=i?1.2:.4;x.fillStyle=`hsl(${145-k*35},70%,${58-k*20}%)`;x.beginPath();x.roundRect(p.x*S+m,p.y*S+m,S-2*m,S-2*m,i?6:8);x.fill()});\n const h=sn[0],ex=dir.y?5:0,ey=dir.x?5:0,fx=dir.x*3,fy=dir.y*3;x.fillStyle='#fff';\n [[-1,-1],[1,1]].forEach(([a])=>{const ox=ey?0:a*ex,oy=ex?0:a*ey;x.beginPath();x.arc(h.x*S+10+fx+(dir.y?a*4:0),h.y*S+10+fy+(dir.x?a*4:0),2.6,0,7);x.fill()});\n x.fillStyle='#0f172a';[-1,1].forEach(a=>{x.beginPath();x.arc(h.x*S+10+fx*1.4+(dir.y?a*4:0),h.y*S+10+fy*1.4+(dir.x?a*4:0),1.2,0,7);x.fill()});\n parts=parts.filter(p=>p.l>0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=.03;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3)});x.globalAlpha=1}\nfunction loop(t){requestAnimationFrame(loop);const dt=Math.min(t-last,100)||0;last=t;\n if(state=='play'){acc+=dt;while(acc>=delay()&&state=='play'){acc-=delay();step()}if(bonus){bonus.t-=dt;if(bonus.t<=0)bonus=null}}\n draw(t)}\naddEventListener('keydown',e=>{const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];\n if(m){e.preventDefault();turn(...m)}else if(e.key==' '||e.key=='p'){e.preventDefault();pause()}else if(e.key=='Enter'&&(state=='menu'||state=='over'))start();else if(e.key=='m')snd=!snd});\nlet sx,sy;C.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};\nC.ontouchend=e=>{const a=e.changedTouches[0].clientX-sx,b=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(a),Math.abs(b))<20)return;Math.abs(a)>Math.abs(b)?turn(a>0?1:-1,0):turn(0,b>0?1:-1)};\nfood=free();menu();requestAnimationFrame(loop);\n<\/script><\/body><\/html>\n"}];

let cat='all',favs=[];
try{favs=JSON.parse(localStorage.getItem('pc_favs')||'[]')}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('pc_favs',JSON.stringify(favs))}catch(e){}};
const cats=['all','fav',...new Set(GAMES.map(g=>g.cat))];
const label=c=>c=='all'?'All Games':c=='fav'?'❤ Favorites':c;
$('cats').innerHTML=cats.map(c=>`<button class="cat${c=='all'?' active':''}" data-c="${c}">${label(c)}</button>`).join('');
$('stats').innerHTML=`<span>${GAMES.length} games</span><span>${cats.length-2} categories</span><span>100% free</span>`;
function render(){
  const q=$('q').value.toLowerCase().trim(),g=$('grid');g.innerHTML='';
  const list=GAMES.filter(x=>(cat=='all'||(cat=='fav'?favs.includes(x.id):x.cat==cat))&&(x.t+' '+x.cat).toLowerCase().includes(q));
  if(!list.length){g.innerHTML=`<p class="none">${cat=='fav'?'No favorites yet — tap the ♥ on a game.':'No games found.'}</p>`;return}
  list.forEach(x=>{
    const d=document.createElement('div');d.className='card';d.onmousemove=e=>{const r=d.getBoundingClientRect();d.style.setProperty('--mx',e.clientX-r.left+'px');d.style.setProperty('--my',e.clientY-r.top+'px')};
    d.innerHTML=`<div class="thumb" style="background:linear-gradient(135deg,${x.g})"><span>${x.e}</span><i class="tag">${x.cat}</i>${badge(x)}<button class="fav${favs.includes(x.id)?' on':''}" title="Favorite">${favs.includes(x.id)?'♥':'♡'}</button></div><div class="body"><b>${x.t}</b><p>${DESC[x.id]||''}</p><div class="acts"><button class="play">▶ Play now</button><button class="rl">📖 Rules</button></div></div>`;
    d.onclick=e=>{
      if(e.target.closest('.rl')){showRules(x);return}
      if(e.target.closest('.fav')){favs=favs.includes(x.id)?favs.filter(i=>i!=x.id):[...favs,x.id];saveFavs();render();return}
      open(x)};
    g.appendChild(d)})}
let curGame,plays={};try{plays=JSON.parse(localStorage.getItem('pc_plays')||'{}')}catch(e){}
const HOT=['snake','tetris','g2048','flap','chess','wg','ms','c4','pong','wam'],NEW=['tetris','brk','simon','slide','lo','rps','rt'];
const trendList=()=>[...GAMES].sort((a,b)=>((plays[b.id]||0)*4+(HOT.includes(b.id)?10-HOT.indexOf(b.id):0))-((plays[a.id]||0)*4+(HOT.includes(a.id)?10-HOT.indexOf(a.id):0))).slice(0,8);
const badge=x=>trendList().slice(0,4).some(g=>g.id==x.id)?'<i class="bd hot">🔥 HOT</i>':NEW.includes(x.id)?'<i class="bd new">✨ NEW</i>':'';
function renderTrend(){$('trend').innerHTML=trendList().map((g,i)=>`<div class="tc" data-id="${g.id}" style="background:linear-gradient(135deg,${g.g})"><span class="n">${i+1}</span><span class="em">${g.e}</span><div>${g.t}<small>${g.cat}${plays[g.id]?' · played '+plays[g.id]+'×':''}</small></div></div>`).join('')}
$('trend').onclick=e=>{const t=e.target.closest('.tc');if(t)open(GAMES.find(g=>g.id==t.dataset.id))};
$('mq').innerHTML=[0,1].map(()=>GAMES.map(g=>`<span>${g.e} ${g.t}</span>`).join('')).join('');
function showRules(x){$('rt').textContent='📖 '+x.t+' — How to play';$('rlist').innerHTML=(RULES[x.id]||['Just play and have fun!']).map(r=>`<li>${r}</li>`).join('');$('rules').classList.add('open');$('rp').onclick=()=>{$('rules').classList.remove('open');if(!$('modal').classList.contains('open'))open(x)}}
$('rx').onclick=()=>$('rules').classList.remove('open');$('rules').onclick=e=>{if(e.target==$('rules'))$('rules').classList.remove('open')};
$('rb').onclick=()=>showRules(curGame);
let recent=[];try{recent=JSON.parse(localStorage.getItem('pc_recent')||'[]')}catch(e){}
function renderExtras(){
  $('recent').innerHTML=recent.length?'<span>Recently played:</span>'+recent.map(id=>GAMES.find(g=>g.id==id)).filter(Boolean).map(g=>`<button class="cat" data-id="${g.id}">${g.e} ${g.t}</button>`).join(''):'';
  const L=[];try{const s=JSON.parse(localStorage.getItem('snk2')||'{}');['Easy','Normal','Hard'].forEach((n,i)=>[['s','solid walls'],['w','wrap']].forEach(([k,w])=>{if(s[i+k])L.push(`🐍 Snake · ${n} · ${w}: <b>${s[i+k]}</b>`)}));
  const b=+localStorage.getItem('b2048');if(b)L.push(`🔢 2048 best score: <b>${b}</b>`);
  const tt=+localStorage.getItem('tet'),bk=+localStorage.getItem('brk'),rx=+localStorage.getItem('rt'),sm=+localStorage.getItem('sim');if(tt)L.push(`🧱 Tetris best: <b>${tt}</b>`);if(bk)L.push(`🧨 Breakout best: <b>${bk}</b>`);if(sm)L.push(`🎵 Simon best round: <b>${sm}</b>`);if(rx)L.push(`⚡ Reaction best: <b>${rx} ms</b>`);
  const pg=+localStorage.getItem('pong'),wg=+localStorage.getItem('wg'),wm=+localStorage.getItem('wam');if(pg)L.push(`🏓 Pong wins vs computer: <b>${pg}</b>`);if(wg)L.push(`🟩 Word Guess solved: <b>${wg}</b>`);if(wm)L.push(`🐹 Whack-a-Mole best: <b>${wm}</b>`);
  const fl=+localStorage.getItem('flap'),ms=+localStorage.getItem('ms'),hm=+localStorage.getItem('hm');if(fl)L.push(`🐤 Sky Flap best: <b>${fl}</b>`);if(ms)L.push(`💣 Minesweeper fastest clear: <b>${ms}s</b>`);if(hm)L.push(`🔤 Hangman best streak: <b>${hm}</b>`);
  const c=JSON.parse(localStorage.getItem('c4')||'{}');if(c.w||c.l)L.push(`🔴 Connect 4 vs computer: <b>${c.w||0}</b> wins · ${c.l||0} losses`)}catch(e){}
  $('recl').innerHTML=L.length?L.map(x=>`<li>${x}</li>`).join(''):'<li>Play a game to set your first record!</li>'}
$('recent').onclick=e=>{const b=e.target.closest('button');if(b)open(GAMES.find(g=>g.id==b.dataset.id))};
function open(x){curGame=x;plays[x.id]=(plays[x.id]||0)+1;try{localStorage.setItem('pc_plays',JSON.stringify(plays))}catch(e){}renderTrend();recent=[x.id,...recent.filter(i=>i!=x.id)].slice(0,4);try{localStorage.setItem('pc_recent',JSON.stringify(recent))}catch(e){}
$('mt').textContent=x.e+' '+x.t;$('fr').srcdoc=x.html;$('modal').classList.add('open');document.body.style.overflow='hidden'}
function close(){setTimeout(renderExtras,50);$('modal').classList.remove('open');$('fr').srcdoc='';document.body.style.overflow='auto'}
$('cl').onclick=close;$('modal').onclick=e=>{if(e.target==$('modal'))close()};
$('fs').onclick=()=>{const f=$('fr');(f.requestFullscreen||f.webkitRequestFullscreen||(()=>{})).call(f)};
addEventListener('keydown',e=>{if(e.key=='Escape'){$('rules').classList.contains('open')?$('rules').classList.remove('open'):close()}});
$('q').oninput=render;
$('rnd').onclick=()=>open(GAMES[Math.random()*GAMES.length|0]);
$('cats').onclick=e=>{const b=e.target.closest('.cat');if(!b)return;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.c;render()};
$('th').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme=='dark':!matchMedia('(prefers-color-scheme: light)').matches;r.dataset.theme=dark?'light':'dark'};
render();renderExtras();renderTrend();
</script>
</body>
</html>
