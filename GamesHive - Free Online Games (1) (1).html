<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GamesHive - Free Online Games</title>
<style>
:root{--bg:#0a0e1f;--bg2:rgba(255,255,255,.06);--card:#141b33;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--text:#f8fafc;--muted:#9aa7c0;--accent:#7c6cff;--accent2:#38bdf8;--r:22px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2fb;--bg2:rgba(15,23,42,.06);--card:#fff;--glass:rgba(255,255,255,.75);--line:rgba(15,23,42,.1);--text:#0f172a;--muted:#475569}}
:root[data-theme="light"]{--bg:#eef2fb;--bg2:rgba(15,23,42,.06);--card:#fff;--glass:rgba(255,255,255,.75);--line:rgba(15,23,42,.1);--text:#0f172a;--muted:#475569}
:root[data-theme="dark"]{--bg:#0a0e1f;--bg2:rgba(255,255,255,.06);--card:#141b33;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.1);--text:#f8fafc;--muted:#9aa7c0}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
body{color:var(--text);min-height:100%;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 40% at 18% 20%,rgba(124,108,255,.38),transparent),radial-gradient(35% 35% at 82% 12%,rgba(236,72,153,.28),transparent),radial-gradient(40% 40% at 70% 88%,rgba(56,189,248,.28),transparent);filter:blur(40px);animation:aur 16s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(4%,3%) scale(1.12)}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line);padding:.8rem 1.5rem;display:flex;gap:1rem;align-items:center}
.logo{font-size:1.5rem;font-weight:900;color:var(--text);text-decoration:none;white-space:nowrap;letter-spacing:-.5px}.logo span{background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.search{flex:1;max-width:420px;margin-left:auto;padding:.7rem 1.2rem;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);color:var(--text);outline:none;transition:.2s}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,108,255,.2)}
.ib{background:var(--glass);border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1rem}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 1.5rem}
.hero{margin:1.5rem auto 0;border-radius:28px;padding:2.4rem;background:linear-gradient(120deg,#6366f1,#a855f7 45%,#ec4899,#6366f1);background-size:250% 250%;animation:hg 12s ease infinite;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;overflow:hidden;position:relative;box-shadow:0 25px 60px -20px rgba(124,108,255,.7)}
@keyframes hg{50%{background-position:100% 50%}}
.hero h1{font-size:clamp(1.8rem,4.5vw,3rem);line-height:1.05;margin-bottom:.7rem;font-weight:900;text-shadow:0 4px 20px rgba(0,0,0,.25)}.hero p{opacity:.92;max-width:460px;margin-bottom:1.2rem}
.btn{background:#fff;color:#4338ca;border:0;padding:.8rem 1.6rem;border-radius:999px;font-weight:800;cursor:pointer;font-size:1rem;transition:.2s;box-shadow:0 8px 20px rgba(0,0,0,.25)}.btn:hover{transform:scale(1.06) rotate(-1deg)}
.hero .big{font-size:clamp(4rem,12vw,8rem);animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 14px 24px rgba(0,0,0,.4))}
@keyframes fl{50%{transform:translateY(-12px) rotate(5deg)}}
.stats{display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap}.stats span{background:rgba(255,255,255,.2);backdrop-filter:blur(8px);padding:.35rem .9rem;border-radius:999px;font-size:.8rem;font-weight:700}
.mq{overflow:hidden;margin-top:1.3rem;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq>div{display:flex;gap:2.2rem;width:max-content;animation:mq 40s linear infinite;color:var(--muted);font-weight:700;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.sh{font-size:1.35rem;font-weight:900;margin:1.8rem 0 .5rem;letter-spacing:-.3px}
.trend{display:flex;gap:1rem;overflow-x:auto;padding:.9rem 0 1.1rem;scroll-snap-type:x mandatory}
.tc{flex:0 0 200px;height:150px;scroll-snap-align:start;position:relative;border-radius:22px;cursor:pointer;overflow:hidden;display:flex;align-items:flex-end;padding:.9rem;font-weight:800;color:#fff;transition:.3s;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
.tc:hover{transform:scale(1.05) rotate(-1deg)}.tc .n{position:absolute;left:12px;top:-6px;font-size:5.2rem;font-weight:900;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.75);line-height:1}.tc .em{position:absolute;right:14px;top:16px;font-size:3.2rem}.tc small{display:block;font-weight:600;opacity:.85;font-size:.75rem}
.cats{display:flex;gap:.5rem;padding:.4rem 0 .6rem;overflow-x:auto}
.cat{background:var(--glass);border:1px solid var(--line);color:var(--muted);padding:.55rem 1.25rem;border-radius:999px;cursor:pointer;font-weight:700;white-space:nowrap;transition:.2s;backdrop-filter:blur(8px)}
.cat.active,.cat:hover{background:linear-gradient(90deg,#6366f1,#a855f7);color:#fff;border-color:transparent;box-shadow:0 8px 20px -6px rgba(124,108,255,.7)}
main{flex:1;padding-bottom:3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.2rem;margin-top:.8rem}
.card{--mx:50%;--my:50%;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s,border-color .3s;display:flex;flex-direction:column;position:relative}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,255,255,.16),transparent 60%);opacity:0;transition:.3s;pointer-events:none}
.card:hover::after{opacity:1}.card:hover{transform:translateY(-8px) rotate(-.4deg);border-color:rgba(129,140,248,.7);box-shadow:0 22px 50px -12px rgba(124,108,255,.55)}
.thumb{height:140px;display:flex;align-items:center;justify-content:center;font-size:4rem;position:relative}
.thumb span{transition:transform .3s;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35))}.card:hover .thumb span{transform:scale(1.25) rotate(-8deg)}
.tag{font-style:normal;position:absolute;top:10px;left:10px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:999px}
.bd{font-style:normal;position:absolute;bottom:10px;left:10px;font-size:.68rem;font-weight:900;padding:.2rem .6rem;border-radius:999px;color:#fff;letter-spacing:.04em}.bd.hot{background:linear-gradient(90deg,#f97316,#ef4444)}.bd.new{background:linear-gradient(90deg,#06b6d4,#3b82f6)}
.fav{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.35);border:0;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;z-index:2}.fav.on{color:#f43f5e}
.body{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;gap:.35rem;flex:1}.body b{font-size:1.05rem}.body p{color:var(--muted);font-size:.85rem;flex:1}
.acts{display:flex;gap:.5rem;margin-top:.5rem;position:relative;z-index:2}.play{flex:1;background:linear-gradient(90deg,#6366f1,#a855f7);color:#fff;border:0;border-radius:12px;padding:.6rem;font-weight:800;cursor:pointer}
.rl{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;font-weight:700;cursor:pointer}.rl:hover{border-color:var(--accent)}
.none{grid-column:1/-1;text-align:center;color:var(--muted);padding:2rem}
.recent{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:1.2rem;color:var(--muted);font-size:.85rem}.recent:empty{display:none}
.rec{margin-top:1.2rem;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1.2rem}.rec summary{cursor:pointer;font-weight:800}.rec ul{margin-top:.6rem;padding-left:1.2rem;color:var(--muted);font-size:.9rem;line-height:1.7}.rec b{color:var(--text)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:1.5rem;border-top:1px solid var(--line)}
.modal{display:none;position:fixed;inset:0;z-index:1000;background:rgba(3,6,18,.92);backdrop-filter:blur(10px);align-items:center;justify-content:center;padding:1rem}.modal.open{display:flex}
.box{background:#141b33;border-radius:var(--r);width:100%;max-width:1100px;height:92%;display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.mh{padding:.7rem 1.2rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem;color:#f8fafc;border-bottom:1px solid rgba(255,255,255,.1)}.mh h3{flex:1}.mh .ib{background:rgba(255,255,255,.1);color:#fff;border:0}.mh .ib:hover{background:#ef4444}
iframe{flex:1;width:100%;border:none;background:#000}
@media(max-width:600px){header{padding:.7rem 1rem;flex-wrap:wrap}.wrap{padding:0 1rem}.hero{padding:1.5rem}.hero .big{display:none}.search{order:3;max-width:none;flex-basis:100%;margin:0}.logo{margin-right:auto}.tc{flex-basis:165px}}
</style>
</head>
<body>
<header><a href="#" class="logo">🎮 Games<span>Hive</span></a><input id="q" class="search" placeholder="Search games..."><button class="ib" id="th" title="Toggle theme">🌓</button></header>
<main><div class="wrap">
<section class="hero"><div><h1>Level up your<br>game time. 🔥</h1><p>Classic board games, brain teasers and arcade fun, all in one place. No downloads, no sign-ups.</p><button class="btn" id="rnd">🎲 Surprise me</button><div class="stats" id="stats"></div></div><div class="big">🎮</div></section>

<div class="recent" id="recent"></div>

<nav class="cats" id="cats"></nav>
<div class="grid" id="grid"></div>
</div></main>
<footer>GamesHive · Made for fun · Press Esc to close a game</footer>

<div class="modal" id="rules" style="z-index:1100"><div class="box" style="height:auto;max-width:520px;max-height:90%;overflow:auto"><div class="mh"><h3 id="rt"></h3><button class="ib" id="rx">&times;</button></div><div style="padding:1rem 1.4rem 1.4rem;color:#e2e8f0"><ul id="rlist" style="padding-left:1.2rem;line-height:1.75"></ul><button class="btn" style="margin-top:1rem;background:#6366f1;color:#fff" id="rp">▶ Play now</button></div></div></div>
<script>
const GAMES=[{"id": "chess", "t": "Chess", "cat": "Board", "e": "\u265f\ufe0f", "g": "#334155,#0f172a", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Chess<\/title>\n<style>\n  :root {\n    --bg: #FFFFFF;\n    --ink: #1A1D24;\n    --muted: #5F6673;\n    --line: #E2E5EB;\n    --field: #C9CED8;\n    --soft: #F6F7F9;\n    --accent: #2457D6;\n    --accent-ink: #FFFFFF;\n    --bad: #C62828;\n    --sq-light: #EEF2F8;\n    --sq-dark: #8EA2C6;\n    --co-on-light: #5B6B8C;\n    --co-on-dark: #EEF2F8;\n    box-sizing: border-box;\n    padding-top: env(safe-area-inset-top, 0px);\n    padding-bottom: env(safe-area-inset-bottom, 0px);\n  }\n  @media (prefers-color-scheme: dark) {\n    :root:not([data-theme=\"light\"]) {\n      --bg: #0F1424; --ink: #E8ECF7; --muted: #9AA5C4; --line: #2B3558; --field: #3A4670; --soft: #171E36;\n      --accent: #8FA8FF; --accent-ink: #0F1424; --bad: #FF7770;\n      --sq-light: #A9B6D6; --sq-dark: #5A6C9E; --co-on-light: #3C4A70; --co-on-dark: #DDE4F5;\n    }\n  }\n  :root[data-theme=\"dark\"] {\n    --bg: #0F1424; --ink: #E8ECF7; --muted: #9AA5C4; --line: #2B3558; --field: #3A4670; --soft: #171E36;\n    --accent: #8FA8FF; --accent-ink: #0F1424; --bad: #FF7770;\n    --sq-light: #A9B6D6; --sq-dark: #5A6C9E; --co-on-light: #3C4A70; --co-on-dark: #DDE4F5;\n  }\n  html { scroll-padding-top: env(safe-area-inset-top, 0px); }\n  *, *::before, *::after { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }\n  main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; }\n  h1 { font-size: clamp(1.6rem, 4.5vw, 2.3rem); letter-spacing: -0.03em; line-height: 1.15; margin: 0 0 4px; }\n  h2 { font-size: 1.05rem; margin: 0 0 10px; }\n  .lede { color: var(--muted); margin: 0 0 20px; }\n  .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }\n  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }\n  .panel { border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: var(--bg); margin-bottom: 16px; }\n  .panel.soft { background: var(--soft); }\n\n  label { display: block; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }\n  select { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--field); border-radius: 6px; padding: 9px 10px; min-height: 44px; }\n  select:disabled { opacity: .5; }\n  button { font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--field); background: var(--bg); color: var(--ink); }\n  button:hover:not(:disabled) { background: var(--soft); }\n  button:disabled { opacity: .5; cursor: not-allowed; }\n  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }\n  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }\n  .row { display: flex; flex-wrap: wrap; gap: 10px; }\n  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }\n  @media (max-width: 480px) { .grid3 { grid-template-columns: 1fr; } }\n\n  /* Board */\n  .board-wrap { container-type: inline-size; width: 100%; max-width: 620px; }\n  #board { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }\n  .sq { position: relative; aspect-ratio: 1; min-height: 0; padding: 0; border: 0; border-radius: 0; font-weight: 400;\n        display: flex; align-items: center; justify-content: center; font-size: 9.8cqw; line-height: 1; cursor: pointer; }\n  .sq.light { background-color: var(--sq-light); }\n  .sq.dark { background-color: var(--sq-dark); }\n  .sq:hover:not(:disabled) { filter: brightness(1.06); background-color: inherit; }\n  .sq.light:hover { background-color: var(--sq-light); }\n  .sq.dark:hover { background-color: var(--sq-dark); }\n  .sq.last { background-image: linear-gradient(rgba(255, 214, 10, .5), rgba(255, 214, 10, .5)); }\n  .sq.chk { background-image: radial-gradient(circle, rgba(220, 38, 38, .85) 0%, rgba(220, 38, 38, 0) 72%); }\n  .sq.sel { box-shadow: inset 0 0 0 4px var(--accent); }\n  .sq.tgt::after { content: \"\"; position: absolute; width: 28%; height: 28%; border-radius: 50%; background: rgba(20, 30, 60, .38); }\n  .sq.cap::after { content: \"\"; position: absolute; inset: 4%; border-radius: 50%; border: 5px solid rgba(20, 30, 60, .38); }\n  .pc { position: relative; z-index: 1; pointer-events: none; font-family: \"Segoe UI Symbol\", \"Noto Sans Symbols 2\", \"DejaVu Sans\", \"Apple Symbols\", system-ui, sans-serif; }\n  .pc.w { color: #FFFFFF; -webkit-text-stroke: 2px #15181F; paint-order: stroke fill; }\n  .pc.b { color: #15181F; -webkit-text-stroke: 1px #000; }\n  .co { position: absolute; font-size: clamp(9px, 2.2cqw, 12px); font-weight: 700; line-height: 1; pointer-events: none; z-index: 2; font-family: system-ui, sans-serif; }\n  .co.rk { top: 3px; left: 4px; }\n  .co.fl { bottom: 3px; right: 4px; }\n  .light .co { color: var(--co-on-light); }\n  .dark .co { color: var(--co-on-dark); }\n\n  .captured { min-height: 2.2rem; margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 1.3rem; }\n  .captured .grp { display: inline-flex; align-items: center; gap: 2px; }\n  .captured .who { font-size: .85rem; color: var(--muted); margin-right: 4px; }\n  .captured .adv { font-size: .85rem; font-weight: 700; color: var(--muted); margin-left: 4px; }\n  .cp { font-family: \"Segoe UI Symbol\", \"Noto Sans Symbols 2\", \"DejaVu Sans\", \"Apple Symbols\", system-ui, sans-serif; }\n  .cp.w { color: #FFFFFF; - ", "cat": "Board", "e": "\ud83d\udc0d", "g": "#16a34a,#14532d", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Snakes and Ladders<\/title>\n<style>\n  :root {\n    --bg: #FFFFFF;\n    --ink: #1A1D24;\n    --muted: #5F6673;\n    --line: #E2E5EB;\n    --field: #C9CED8;\n    --soft: #F6F7F9;\n    --cell-a: #FFFFFF;\n    --cell-b: #EEF2F8;\n    --cell-num: #7B8496;\n    --accent: #2457D6;\n    --accent-ink: #FFFFFF;\n    --bad: #C62828;\n    box-sizing: border-box;\n    padding-top: env(safe-area-inset-top, 0px);\n    padding-bottom: env(safe-area-inset-bottom, 0px);\n  }\n  @media (prefers-color-scheme: dark) {\n    :root:not([data-theme=\"light\"]) {\n      --bg: #0F1424; --ink: #E8ECF7; --muted: #9AA5C4; --line: #2B3558; --field: #3A4670; --soft: #171E36;\n      --cell-a: #171E36; --cell-b: #1D2644; --cell-num: #7C88AD; --accent: #8FA8FF; --accent-ink: #0F1424; --bad: #FF7770;\n    }\n  }\n  :root[data-theme=\"dark\"] {\n    --bg: #0F1424; --ink: #E8ECF7; --muted: #9AA5C4; --line: #2B3558; --field: #3A4670; --soft: #171E36;\n    --cell-a: #171E36; --cell-b: #1D2644; --cell-num: #7C88AD; --accent: #8FA8FF; --accent-ink: #0F1424; --bad: #FF7770;\n  }\n  html { scroll-padding-top: env(safe-area-inset-top, 0px); }\n  *, *::before, *::after { box-sizing: border-box; }\n  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; }\n  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }\n  main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; }\n  h1 { font-size: clamp(1.6rem, 4.5vw, 2.3rem); letter-spacing: -0.03em; line-height: 1.15; margin: 0 0 4px; }\n  h2 { font-size: 1.05rem; margin: 0 0 10px; }\n  .lede { color: var(--muted); margin: 0 0 20px; }\n  .panel { border: 1px solid var(--line); border-radius: 10px ominant-baseline: central; pointer-events: none; }\n  @media (prefers-reduced-motion: reduce) { .token { transition: none; } }\n\n  .turn { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; }\n  .turn .dot { margin: 0; flex: none; }\n  .dice-row { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }\n  .die { width: 72px; height: 72px; border: 2px solid var(--ink); border-radius: 14px; background: var(--bg); padding: 10px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); flex: none; }\n  .die i { width: 12px; height: 12px; border-radius: 50%; background: transparent; justify-self: center; align-self: center; }\n  .die i.on { background: var(--ink); }\n  .die.rolling { animation: shake .25s linear infinite; }\n  @keyframes shake { 0% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } 100% { transform: rotate(-6deg); } }\n  @media (prefers-reduced-motion: reduce) { .die.rolling { animation: none; } }\n  .status { margin: 0; color: var(--muted); font-size: .95rem; }\n\n  table { width: 100%; border-collapse: collapse; font-size: .95rem; margin-top: 4px; }\n  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }\n  th { color: var(--muted); font-weight: 600; }\n  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }\n  tr.current td { font-weight: 700; }\n  .pname { display: inline-flex; align-items: center; gap: 8px; }\n  .pname .dot { width: 14px; height: 14px; margin: 0; border-width: 2px; }\n\n  #log { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow-y: auto; font-size: .92rem; }\n  #log li { padding: 5px 0; border-bottom: 1px solid var(--line); }\n  #log li:first-child { font-weight: 600; }\n  .gap { margin-top: 16px; }\n  .winner { border: 2px solid var(--accent); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }\n  .winner strong { font-size: 1.2rem; display: block; margin-bottom: 8px; }\n  details { margin-top: 16px; }\n  summary { cursor: pointer; font-weight: 600; min-height: 32px; }\n  details ul { margin: 8px 0 0; padding-left: 20px; color: var(--muted); font-size: .92rem; }\n  .actions { display: flex; flex-wrap: wrap; gap: 10px; }\n  [hidden] { display: none !important; }\n<\/style>\n<\/head>\n<body>\n<main>\n  <h1>Snakes and Ladders<\/h1>\n  <p class=\"lede\">Race to square 100. Ladders lift you up, snakes drag you down.<\/p>\n\n  <!-- Setup screen -->\n  <section id=\"setup\" class=\"panel\">\n    <h2>New game<\/h2>\n    <div style=\"margin-bottom:14px\">\n      <label for=\"count\">Number of players<\/label>\n      <select id=\"count\">\n        <option value=\"2\" selected>2 players<\/option>\n        <option value=\"3\">3 players<\/option>\n        <option value=\"4\">4 players<\/option>\n      <\/select>\n    <\/div>\n    <div id=\"prows\"><\/div>\n    <button class=\"primary\" id=\"start\" type=\"button\">Start game<\/button>\n  <\/section>\n\n  <!-- Game screen -->\n  <section id=\"game\">\n    <div class=\"layout\">\n      <svg id=\"board\" viewBox=\"0 0 600 640\" role=\"img\" aria-label=\"Snakes and Ladders board, 10 by 10 squares\"><\/svg>\n\n      <div>\n        <div class=\"panel soft\">\n          <div id=\"winner\" class=\"winner\" hidden>\n            <strong id=\"winnerText\"><\/strong>\n            <button class=\"primary\" id=\"again\" type=\"button\">Play again<\/button>\n          <\/div>\n          <div class=\"turn\" id=\"turn\"><\/div>\n          <div class=\"dice-row\">\n            <div class=\"die\" id=\"die\" role=\"img\" aria-label=\"Dice not rolled yet\"><\/div>\n            <div>\n              <button class=\"primary\" id=\"roll\" type=\"button\">Roll dice<\/button>\n              <p class=\"status\" id=\"status\" role=\"status\"><\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"panel gap\">\n          <h2>Players<\/h2>\n          <table>\n            <thead><tr><th>Player<\/th><th class=\"num\">Square<\/th><\/tr><\/thead>\n            <tbody id=\"plist\"><\/tbody>\n          <\/table>\n        <\/div>\n\n        <div class=\"panel gap\">\n          <h2>What happened<\/h2>\n          <ul id=\"log\" role=\"log\" aria-live=\"polite\"><\/ul>\n        <\/div>\n\n        <div class=\"actions gap\">\n          <button type=\"button\" id=\"newgame\">New game<\/button>\n        <\/div>\n\n        <details>\n          <summary>Rules<\/summary>\n          <ul>\n            <li>Take turns rolling one die and moving that many squares.<\/li>\n            <li>Land at the bottom of a ladder to climb to its top.<\/li>\n            <li>Land on a snake's head to slide down to its tail.<\/li>\n            <li>Roll a 6 and you get another turn.<\/li>\n            <li>You need the exact number to land on 100. If your roll is too high, you stay where you are.<\/li>\n          <\/ul>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/section>\n<\/main>\n\n<script>\n(function () {\n  \"use strict\";\n\n  // ---------- Board data (classic layout) ----------\n  var LADDERS = { 1: 38, 4: 14, 9: 31, 21: 42, 28: 84, 36: 44, 51: 67, 71: 91, 80: 100 };\n  var SNAKES = { 16: 6, 47: 26, 49: 11, 56: 53, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 78 };\n  var COLORS = [\"#D63B3B\", \"#2457D6\", \"#1F8A4C\", \"#7A3FC4\"];\n  var SNAKE_COLORS = [\"#2E9E5B\", \"#E08A1E\", \"#8E5BD0\", \"#D9534F\", \"#1E9AA8\"];\n  var NS = \"http://www.w3.org/2000/svg\";\n  var CELL = 60;\n\n  var $ = function (s) { return document.querySelector(s); };\n  var reduce = !!(window.matchMedia && window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches);\n  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };\n  var esc = function (s) { return String(s).replace(/[&<>\"']/g, function (c) { return { \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]; }); };\n\n  function el(tag, attrs, parent) {\n    var e = document.createElementNS(NS, tag);\n    for (var k in attrs) e.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(e);\n    return e;\n  }\n\n  // Square number (1..100) to centre point. Rows zig-zag, starting bottom-left.\n  function center(n) {\n    var r = Math.floor((n - 1) / 10), c = (n - 1) % 10;\n    var col = r % 2 === 0 ? c : 9 - c;\n    return { x: col * CELL + CELL / 2, y: (9 - r) * CELL + CELL / 2 };\n  }\n\n  // ---------- Board drawing ----------\n  function drawBoard() {\n    var svg = $(\"#board\");\n    svg.innerHTML = \"\";\n    var i, p, r, c, col;\n\n    for (i = 1; i <= 100; i++) {\n      r = Math.floor((i - 1) / 10); c = (i - 1) % 10;\n      col = r % 2 === 0 ? c : 9 - c;\n      el(\"rect\", { x: col * CELL, y: (9 - r) * CELL, width: CELL, height: CELL, \"class\": (r + col) % 2 ? \"cell-a\" : \"cell-b\" }, svg);\n      var t = el(\"text\", { x: col * CELL + 5, y: (9 - r) * CELL + 15, \"class\": \"cell-num\" }, svg);\n      t.textContent = i;\n    }\n    el(\"text\", { x: 150, y: 625, \"class\": \"board-note\" }, svg).textContent = \"Start: tokens wait here until the first move\";\n\n    Object.keys(LADDERS).forEach(function (k) { drawLadder(svg, center(+k), center(LADDERS[k])); });\n    var idx = 0;\n    Object.keys(SNAKES).forEach(function (k) { drawSnake(svg, center(+k), center(SNAKES[k]), SNAKE_COLORS[idx++ % SNAKE_COLORS.length]); });\n  }\n\n  function drawLadder(svg, a, b) {\n    var dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy);\n    var ux = dx / len, uy = dy / len, nx = -uy * 7, ny = ux * 7;\n    var g = el(\"g\", { stroke: \"#B9812F\", \"stroke-linecap\": \"round\" }, svg);\n    el(\"line\", { x1: a.x + nx, y1: a.y + ny, x2: b.x + nx, y2: b.y + ny, \"stroke-width\": 4 }, g);\n    el(\"line\", { x1: a.x - nx, y1: a.y - ny, x2: b.x - nx, y2: b.y - ny, \"stroke-width\": 4 }, g);\n    var rungs = Math.max(2, Math.floor(len / 22));\n    for (var i = 1; i <= rungs; i++) {\n      var t = i / (rungs + 1), px = a.x + dx * t, py = a.y + dy * t;\n      el(\"line\", { x1: px + nx, y1: py + ny, x2: px - nx, y2: py - ny, \"stroke-width\": 3 }, g);\n    }\n  }\n\n  function drawSnake(svg, head, tail, color) {\n    var dx = tail.x - head.x, dy = tail.y - head.y, len = Math.sqrt(dx * dx + dy * dy);\n    var ux = dx / len, uy = dy / len, nx = -uy, ny = ux;\n    var waves = Math.max(2, Math.round(len / 75)), steps = 28, amp = 13, pts = [];\n    for (var i = 0; i <= steps; i++) {\n      var t = i / steps, off = Math.sin(t * Math.PI * waves) * amp * (0.4 + 0.6 * Math.sin(t * Math.PI));\n      pts.push({ x: head.x + dx * t + nx * off, y: head.y + dy * t + ny * off });\n    }\n    var d = \"M\" + pts[0].x.toFixed(1) + \" \" + pts[0].y.toFixed(1);\n    for (var j = 1; j < pts.length - 1; j++) {\n      var mx = (pts[j].x + pts[j + 1].x) / 2, my = (pts[j].y + pts[j + 1].y) / 2;\n      d += \" Q\" + pts[j].x.toFixed(1) + \" \" + pts[j].y.toFixed(1) + \" \" + mx.toFixed(1) + \" \" + my.toFixed(1);\n    }\n    var last = pts[pts.length - 1];\n    d += \" L\" + last.x.toFixed(1) + \" \" + last.y.toFixed(1);\n\n    var g = el(\"g\", {}, svg);\n    el(\"path\", { d: d, fill: \"none\", stroke: color, \"stroke-width\": 9, \"stroke-linecap\": \"round\", \"stroke-linejoin\": \"round\" }, g);\n    el(\"path\", { d: d, fill: \"none\", stroke: \"#FFFFFF\", \"stroke-opacity\": 0.55, \"stroke-width\": 2.5, \"stroke-dasharray\": \"3 9\", \"stroke-linecap\": \"round\" }, g);\n    // head with eyes and tongue\n    var hx = head.x, hy = head.y;\n    el(\"path\", { d: \"M\" + hx + \" \" + hy + \" l\" + (ux * -12) + \" \" + (uy * -12), stroke: \"#D63B3B\", \"stroke-width\": 2, \"stroke-linecap\": \"round\" }, g);\n    el(\"circle\", { cx: hx, cy: hy, r: 9, fill: color }, g);\n    el(\"circle\", { cx: hx + nx * 3.5 - ux * 2, cy: hy + ny * 3.5 - uy * 2, r: 2.3, fill: \"#fff\" }, g);\n    el(\"circle\", { cx: hx - nx * 3.5 - ux * 2, cy: hy - ny * 3.5 - uy * 2, r: 2.3, fill: \"#fff\" }, g);\n    el(\"circle\", { cx: hx + nx * 3.5 - ux * 2.6, cy: hy + ny * 3.5 - uy * 2.6, r: 1.1, fill: \"#111\" }, g);\n    el(\"circle\", { cx: hx - nx * 3.5 - ux * 2.6, cy: hy - ny * 3.5 - uy * 2.6, r: 1.1, fill: \"#111\" }, g);\n  }\n\n  // ---------- Setup screen ----------\n  var setup = { count: 2, players: [\n    { name: \"Player 1\", ai: false }, { name: \"Computer\", ai: true },\n    { name: \"Player 3\", ai: false }, { name: \"Player 4\", ai: false }\n  ] };\n\n  function renderSetup() {\n    var rows = \"\";\n    for (var i = 0; i < setup.count; i++) {\n      var p = setup.players[i];\n      rows += '<div class=\"prow\">' +\n        '<span class=\"dot\" style=\"background:' + COLORS[i] + '\" aria-hidden=\"true\"><\/span>' +\n        '<div><label for=\"pn' + i + '\">Player ' + (i + 1) + ' name<\/label><input id=\"pn' + i + '\" data-i=\"' + i + '\" maxlength=\"14\" value=\"' + esc(p.name) + '\"><\/div>' +\n        '<div><label for=\"pt' + i + '\">Played by<\/label><select id=\"pt' + i + '\" data-t=\"' + i + '\">' +\n          '<option value=\"human\"' + (p.ai ? \"\" : \" selected\") + '>Person<\/option>' +\n          '<option value=\"ai\"' + (p.ai ? \" selected\" : \"\") + '>Computer<\/option><\/select><\/div>' +\n        '<\/div>';\n    }\n    $(\"#prows\").innerHTML = rows;\n  }\n  $(\"#count\").addEventListener(\"change\", function (e) { setup.count = Number(e.target.value); renderSetup(); });\n  $(\"#prows\").addEventListener(\"input\", function (e) {\n    if (e.target.hasAttribute(\"data-i\")) setup.players[Number(e.target.getAttribute(\"data-i\"))].name = e.target.value;\n  });\n  $(\"#prows\").addEventListener(\"change\", function (e) {\n    if (e.target.hasAttribute(\"data-t\")) setup.players[Number(e.target.getAttribute(\"data-t\"))].ai = e.target.value === \"ai\";\n  });\n\n  // ---------- Game state ----------\n  var game = null;\n\n  function startGame() {\n    var players = [];\n    for (var i = 0; i < setup.count; i++) {\n      var s = setup.players[i];\n      players.push({ name: (s.name || \"\").trim() || (s.ai ? \"Computer\" : \"Player \" + (i + 1)), ai: s.ai, color: COLORS[i], pos: 0, token: null });\n    }\n    game = { players: players, turn: 0, busy: false, over: false, log: [] };\n\n    $(\"#setup\").style.display = \"none\";\n    $(\"#game\").style.display = \"block\";\n    $(\"#winner\").hidden = true;\n    drawBoard();\n    var svg = $(\"#board\");\n    players.forEach(function (p, i) {\n      var g = el(\"g\", { \"class\": \"token\" }, svg);\n      el(\"circle\", { r: 12, fill: p.color, stroke: \"#fff\", \"stroke-width\": 3 }, g);\n      el(\"circle\", { r: 13.5, fill: \"none\", stroke: \"#1A1D24\", \"stroke-opacity\": 0.35, \"stroke-width\": 1 }, g);\n      el(\"text\", { \"class\": \"token-n\" }, g).textContent = i + 1;\n      p.token = g;\n    });\n    setDie(null);\n    placeTokens();\n    addLog(\"Game started. \" + players[0].name + \" goes first.\");\n    renderPanel();\n    maybeAutoRoll();\n  }\n\n  var OFFSETS = [[-9, -9], [9, -9], [-9, 9], [9, 9]];\n  function placeTokens() {\n    var groups = {};\n    game.players.forEach(function (p, i) { (groups[p.pos] = groups[p.pos] || []).push(i); });\n    game.players.forEach(function (p, i) {\n      var x, y;\n      if (p.pos === 0) { x = 24 + i * 28; y = 620; }\n      else {\n        var c = center(p.pos), grp = groups[p.pos];\n        var o = grp.length > 1 ? OFFSETS[grp.indexOf(i)] : [0, 0];\n        x = c.x + o[0]; y = c.y + o[1];\n      }\n      p.token.style.transform = \"translate(\" + x + \"px,\" + y + \"px)\";\n    });\n  }\n\n  // ---------- Dice ----------\n  var PIPS = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };\n  function setDie(n) {\n    var html = \"\";\n    for (var i = 1; i <= 9; i++) html += '<i class=\"' + (n && PIPS[n].indexOf(i) >= 0 ? \"on\" : \"\") + '\"><\/i>';\n    $(\"#die\").innerHTML = html;\n    $(\"#die\").setAttribute(\"aria-label\", n ? \"Dice shows \" + n : \"Dice not rolled yet\");\n  }\n\n  // ---------- UI updates ----------\n  function addLog(text) {\n    game.log.unshift(text);\n    game.log = game.log.slice(0, 30);\n    $(\"#log\").innerHTML = game.log.map(function (t) { return \"<li>\" + esc(t) + \"<\/li>\"; }).join(\"\");\n  }\n\n  function renderPanel() {\n    var cur = game.players[game.turn];\n    $(\"#turn\").innerHTML = '<span class=\"dot\" style=\"background:' + cur.color + '\" aria-hidden=\"true\"><\/span>' +\n      '<span>' + (game.over ? \"Game over\" : esc(cur.name) + \"'s turn\") + '<\/span>';\n    $(\"#plist\").innerHTML = game.players.map(function (p, i) {\n      return '<tr class=\"' + (i === game.turn && !game.over ? \"current\" : \"\") + '\"><td><span class=\"pname\"><span class=\"dot\" style=\"background:' + p.color + '\" aria-hidden=\"true\"><\/span>' +\n        esc(p.name) + (p.ai ? \" (computer)\" : \"\") + '<\/span><\/td><td class=\"num\">' + (p.pos === 0 ? \"Start\" : p.pos) + '<\/td><\/tr>';\n    }).join(\"\");\n    var btn = $(\"#roll\");\n    btn.disabled = game.busy || game.over || cur.ai;\n    btn.textContent = cur.ai && !game.over ? \"Computer is playing\" : \"Roll dice\";\n  }\n\n  function setStatus(t) { $(\"#status\").textContent = t; }\n\n  // ---------- Turn logic ----------\n  async function roll() {\n    if (!game || game.busy || game.over) return;\n    var g = game; // if \"New game\" is pressed mid-turn, this old turn quietly stops\n    var p = g.players[g.turn];\n    game.busy = true;\n    renderPanel();\n    setStatus(\"Rolling...\");\n\n    var die = $(\"#die\");\n    die.classList.add(\"rolling\");\n    var ticks = reduce ? 1 : 8;\n    for (var i = 0; i < ticks; i++) { setDie(1 + Math.floor(Math.random() * 6)); await sleep(70); }\n    if (game !== g) return;\n    var v = 1 + Math.floor(Math.random() * 6);\n    setDie(v);\n    die.classList.remove(\"rolling\");\n    addLog(p.name + \" rolled a \" + v + \".\");\n\n    var target = p.pos + v;\n    if (target > 100) {\n      addLog(p.name + \" needs exactly \" + (100 - p.pos) + \" to finish, so stays on \" + p.pos + \".\");\n      setStatus(\"Too high. Need exactly \" + (100 - p.pos) + \".\");\n    } else {\n      var stepDelay = reduce ? 30 : 170;\n      while (p.pos < target) { p.pos++; placeTokens(); await sleep(stepDelay); if (game !== g) return; }\n      setStatus(p.name + \" is on \" + p.pos + \".\");\n\n      if (LADDERS[p.pos]) {\n        var from = p.pos; await sleep(reduce ? 30 : 250);\n        if (game !== g) return;\n        p.pos = LADDERS[from]; placeTokens();\n        addLog(\"Ladder! \" + p.name + \" climbs from \" + from + \" to \" + p.pos + \".\");\n        setStatus(\"Ladder! Up to \" + p.pos + \".\");\n        await sleep(reduce ? 30 : 450);\n        if (game !== g) return;\n      } else if (SNAKES[p.pos]) {\n        var at = p.pos; await sleep(reduce ? 30 : 250);\n        if (game !== g) return;\n        p.pos = SNAKES[at]; placeTokens();\n        addLog(\"Snake! \" + p.name + \" slides from \" + at + \" down to \" + p.pos + \".\");\n        setStatus(\"Snake! Down to \" + p.pos + \".\");\n        await sleep(reduce ? 30 : 450);\n        if (game !== g) return;\n      }\n    }\n\n    if (p.pos === 100) {\n      game.over = true; game.busy = false;\n      addLog(p.name + \" reached 100 and wins!\");\n      $(\"#winnerText\").textContent = p.name + \" wins!\";\n      $(\"#winner\").hidden = false;\n      setStatus(\"\");\n      renderPanel();\n      return;\n    }\n\n    if (v === 6) {\n      addLog(p.name + \" rolled a 6 and goes again.\");\n    } else {\n      game.turn = (game.turn + 1) % game.players.length;\n    }\n    game.busy = false;\n    renderPanel();\n    maybeAutoRoll();\n  }\n\n  function maybeAutoRoll() {\n    var g = game, cur = g.players[g.turn];\n    if (!g.over && cur.ai) setTimeout(function () { if (game === g) roll(); }, reduce ? 300 : 900);\n  }\n\n  // ---------- Wiring ----------\n  $(\"#start\").addEventListener(\"click\", startGame);\n  $(\"#roll\").addEventListener(\"click\", roll);\n  $(\"#again\").addEventListener(\"click\", startGame);\n  $(\"#newgame\").addEventListener(\"click\", function () {\n    game = null; // stops any pending computer turn or running animation\n    $(\"#game\").style.display = \"none\";\n    $(\"#setup\").style.display = \"block\";\n  });\n\n  renderSetup();\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "math", "t": "Math Puzzle Attic", "cat": "Puzzle", "e": "\ud83e\uddee", "g": "#f59e0b,#78350f", "html": "<!DOCTYPE html>\n<html lang=\"en\" class=\"dark h-full bg-slate-950\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Math Puzzle Attic \u2022 Picture Equation Riddles to Play Together<\/title>\n    <!-- Tailwind CSS -->\n    <script src=\"https://cdn.tailwindcss.com\"><\/script>\n    <script>\n        tailwind.config = {\n            darkMode: 'class',\n            theme: {\n                extend: {\n                    colors: {\n                        amber: {\n                            50: '#fffbeb',\n                            100: '#fef3c7',\n                            800: '#92400e',\n                            900: '#78350f',\n                            950: '#451a03',\n                        },\n                        warm: {\n                            900: '#1c1917',\n                            950: '#0c0a09'\n                        }\n                    }\n                }\n            }\n        }\n    <\/script>\n    <!-- Font Awesome Icons -->\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css\">\n    <!-- Google Fonts for Vintage Cozy Vibe -->\n    <link href=\"https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&family=Special+Elite&display=swap\" rel=\"stylesheet\">\n    <!-- Canvas Confetti -->\n    <script src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\"><\/script>\n\n    <style>\n        body { font-family: 'Plus Jakarta Sans', sans-serif; }\n        .vintage-font { font-family: 'Cinzel', serif; }\n        .typewriter-font { font-family: 'Special Elite', monospace; }\n\n        .wood-panel {\n            background: linear-gradient(135deg, rgba(30, 20, 10, 0.95), rgba(15, 10, 5, 0.98)), url('https://images.unsplash.com/photo-1546484475-7f7bd55792da?auto=format&fit=crop&w=1200&q=80');\n            background-size: cover;\n            border: 2px solid #78350f;\n        }\n\n        .paper-card {\n            background: #fef3c7;\n            background-image: radial-gradient(#d97706 0.5px, transparent 0.5px);\n            background-size: 16px 16px;\n            color: #451a03;\n            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);\n        }\n\n        .gold-border {\n            border: 2px solid #d97706;\n        }\n        \n        @keyframes floatSlow {\n            0%, 100% { transform: translateY(0px); }\n            50% { transform: translateY(-8px); }\n        }\n        .float-anim {\n            animation: floatSlow 4s ease-in-out infinite;\n        }\n    <\/style>\n<\/head>\n<body class=\"bg-warm-950 text-amber-50 min-h-screen flex flex-col selection:bg-amber-600 selection:text-white\">\n\n    <!-- Header Navigation -->\n    <header class=\"border-b border-amber-900/50 bg-warm-900/90 backdrop-blur-md sticky top-0 z-40 px-4 lg:px-8 py-3 flex items-center justify-between\">\n        <div class=\"flex items-center space-x-3 cursor-pointer\" onclick=\"showHomeScreen()\">\n            <div class=\"w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-700 via-amber-800 to-yellow-600 flex items-center justify-center shadow-lg shadow-amber-900/40 gold-border\">\n                <i class=\"fa-solid fa-calculator text-amber-100 text-xl float-anim\"><\/i>\n            <\/div>\n            <div>\n                <div class=\"flex items-center ce-x-2\">\n                        <i class=\"fa-solid fa-brain text-amber-800\"><\/i>\n                        <span>Equation Riddle:<\/span>\n                    <\/span>\n                    <button onclick=\"readPuzzleAloud()\" class=\"text-amber-900 hover:text-amber-950 font-extrabold flex items-center space-x-1\">\n                        <i class=\"fa-solid fa-volume-high\"><\/i>\n                        <span>Read Aloud<\/span>\n                    <\/button>\n                <\/div>\n\n                <!-- Equation Display Box -->\n                <div class=\"bg-amber-100/90 border-2 border-amber-800/40 rounded-2xl p-5 space-y-3 shadow-inner\">\n                    <div id=\"puzzleEquations\" class=\"typewriter-font text-lg sm:text-2xl font-bold leading-relaxed text-amber-950 space-y-2\">\n                        <!-- Populated by JS -->\n                    <\/div>\n                <\/div>\n\n                <!-- Question Prompt -->\n                <h3 id=\"puzzleQuestion\" class=\"vintage-font text-lg sm:text-xl font-bold text-amber-950 text-center\">\n                    What is the value of the final equation?\n                <\/h3>\n\n                <!-- Input Answer Form -->\n                <form onsubmit=\"handleAnswerSubmit(event)\" class=\"space-y-4 pt-2\">\n                    <div class=\"relative\">\n                        <input type=\"number\" step=\"any\" id=\"userAnswerInput\" placeholder=\"Enter number...\" \n                            class=\"w-full bg-amber-100/90 border-2 border-amber-800/40 rounded-2xl py-4 px-5 text-amber-950 font-bold text-lg placeholder-amber-900/40 focus:outline-none focus:border-amber-800 transition\"\n                            autocomplete=\"off\" required>\n                        <button type=\"submit\" class=\"absolute right-2 top-2 bottom-2 px-6 bg-amber-800 hover:bg-amber-900 text-amber-100 font-extrabold rounded-xl text-sm transition flex items-center space-x-2\">\n                            <span>
